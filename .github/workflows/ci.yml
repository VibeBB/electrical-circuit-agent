name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit for change detection (empty runs the full scope)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag, or SHA to check out"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(docker/|fixtures/|libraries/|scripts/smoke_|src/|tests/integration/|pyproject\.toml$|uv\.lock$|\.github/|\.dockerignore$)' "$RUNNER_TEMP/changed-files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/circuit-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/circuit-tools.Dockerfile .

  fast:
    name: ${{ matrix.python-version == '3.12' && 'fast' || format('fast ({0})', matrix.python-version) }}
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Parallel jobs share the same uv cache name; distinct suffixes
          # avoid "Unable to reserve cache" races on save.
          cache-suffix: fast-${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python scripts/verify_all.py --stage docs
      - run: uv run python scripts/verify_all.py --stage fast

  docker-smoke:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: docker-smoke
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
          echo "commit=$cern_commit" >> "$GITHUB_OUTPUT"
      # buildx with the GitHub Actions cache avoids rebuilding the KiCad base
      # layers on every run; the lock-recorded image stays the publish target.
      - run: >-
          docker buildx build --load
          -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
          --build-arg "CERN_COMMIT=$CERN_COMMIT"
          --cache-from type=gha,scope=circuit-tools
          --cache-to type=gha,mode=max,scope=circuit-tools,ignore-error=true
          .
      - run: >-
          docker run --rm
          --user circuit
          -v "$PWD/fixtures/smoke-board:/work:ro"
          circuit-tools:ci
          python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - run: uv sync --locked
      - run: uv run python scripts/verify_all.py --stage standard
        env:
          CIRCUIT_TOOLS_IMAGE: circuit-tools:ci

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check plugin loads via SDK
        run: uv run python scripts/check_plugin_load.py
