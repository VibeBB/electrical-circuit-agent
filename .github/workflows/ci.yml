name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit for change detection (empty runs the full scope)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag, or SHA to check out"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(docker/|fixtures/|libraries/|scripts/smoke_|src/|tests/integration/|pyproject\.toml$|uv\.lock$|\.github/|\.dockerignore$)' "$RUNNER_TEMP/changed-files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/circuit-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/circuit-tools.Dockerfile .

  fast:
    name: ${{ matrix.python-version == '3.12' && 'fast' || format('fast ({0})', matrix.python-version) }}
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Forward-compatibility canary ahead of the 2026-10-09 stable
          # release: step-level continue-on-error keeps the leg green while
          # the last step reports the failure as an annotation.
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
        id: step
        continue-on-error: ${{ matrix.experimental || false }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: ${{ matrix.experimental || false }}
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Parallel jobs share the same uv cache name; distinct suffixes
          # avoid "Unable to reserve cache" races on save.
          cache-suffix: fast-${{ matrix.python-version }}
      - run: uv sync --locked
        id: step-2
        continue-on-error: ${{ matrix.experimental || false }}
      - run: uv run python scripts/verify_all.py --stage docs
        id: step-3
        continue-on-error: ${{ matrix.experimental || false }}
      - run: uv run python scripts/verify_all.py --stage fast
        id: step-4
        continue-on-error: ${{ matrix.experimental || false }}

      - name: Report 3.15 canary outcome
        if: matrix.experimental && (steps.step.outcome == 'failure' || steps.setup-uv.outcome == 'failure' || steps.step-2.outcome == 'failure' || steps.step-3.outcome == 'failure' || steps.step-4.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  docker-smoke:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: docker-smoke
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
          echo "commit=$cern_commit" >> "$GITHUB_OUTPUT"
      # buildx with the GitHub Actions cache avoids rebuilding the KiCad base
      # layers on every run; the lock-recorded image stays the publish target.
      - run: >-
          docker buildx build --load
          -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
          --build-arg "CERN_COMMIT=$CERN_COMMIT"
          --cache-from type=gha,scope=circuit-tools
          --cache-to type=gha,mode=max,scope=circuit-tools,ignore-error=true
          .
      - run: >-
          docker run --rm
          --user circuit
          -v "$PWD/fixtures/smoke-board:/work:ro"
          circuit-tools:ci
          python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - run: uv sync --locked
      - run: uv run python scripts/verify_all.py --stage standard
        env:
          CIRCUIT_TOOLS_IMAGE: circuit-tools:ci

  real-part-mutation:
    name: real-part-mutation
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: real-part-mutation
      - run: uv sync --locked
      - name: Prepare corpus cache
        run: mkdir -p "$RUNNER_TEMP/corpus-cache" "$RUNNER_TEMP/real-part-mutation"
      - name: Restore TPS62130 datasheet cache
        id: corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-tps62130-f9b1af285622c0cf1a5991f9641a6e64c5e6d899e52cc0b1632808742019579f
      - name: Fetch and verify TPS62130 datasheet
        run: >-
          uv run python scripts/fetch_corpus_datasheet.py
          --entry tps62130-vqfn16
          --cache "$RUNNER_TEMP/corpus-cache"
      - name: Save TPS62130 datasheet cache
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-tps62130-f9b1af285622c0cf1a5991f9641a6e64c5e6d899e52cc0b1632808742019579f
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
      - run: >-
          docker buildx build --load
          -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
          --build-arg "CERN_COMMIT=$CERN_COMMIT"
          --cache-from type=gha,scope=circuit-tools
          --cache-to type=gha,mode=max,scope=circuit-tools,ignore-error=true
          .
      - name: Run production mutation verifier in the tools image
        run: |
          set -euo pipefail
          chmod 0777 "$RUNNER_TEMP/real-part-mutation"
          docker run --rm --network none --user circuit \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/corpus-cache:/corpus-cache:ro" \
            -v "$RUNNER_TEMP/real-part-mutation:/out" \
            -w /repo \
            -e PYTHONPATH=/repo/src \
            -e CIRCUIT_REQUIRE_CORPUS_PDFS=1 \
            -e CIRCUIT_CORPUS_CACHE=/corpus-cache \
            circuit-tools:ci \
            python3 scripts/run_real_mutation_matrix.py \
              --entry tps62130-vqfn16 \
              --cache /corpus-cache \
              --out /out/tps62130-real-mutation-report.json \
              --export-oracle
      - name: Upload real-part mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tps62130-real-mutation-report
          path: ${{ runner.temp }}/real-part-mutation/tps62130-real-mutation-report.json
          if-no-files-found: ignore

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check plugin loads via SDK
        run: uv run python scripts/check_plugin_load.py
