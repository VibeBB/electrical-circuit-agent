name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit for change detection (empty runs the full scope)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag, or SHA to check out"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(docker/|fixtures/|libraries/|scripts/smoke_|src/|tests/integration/|pyproject\.toml$|uv\.lock$|\.github/|\.dockerignore$)' "$RUNNER_TEMP/changed-files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Hadolint is read-only on docker/**: overlap it with the BuildKit
      # setup + --check and join it before the job ends.
      - name: Lint Dockerfiles with hadolint
        id: hadolint
        background: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/circuit-tools.Dockerfile
          recursive: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run BuildKit checks
        run: docker build --check -f docker/circuit-tools.Dockerfile .
      - name: Wait for hadolint
        wait: hadolint

  fast:
    name: ${{ matrix.python-version == '3.12' && 'fast' || format('fast ({0})', matrix.python-version) }}
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
        id: step
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Parallel jobs share the same uv cache name; distinct suffixes
          # avoid "Unable to reserve cache" races on save.
          cache-suffix: fast-${{ matrix.python-version }}
      - run: uv sync --locked
        id: step-2
      # The docs and fast stages are independent verify_all invocations
      # against the same synced venv; run them as background legs and join
      # them at the end.
      - run: uv run python scripts/verify_all.py --stage docs
        id: step-3
        background: true
      - run: uv run python scripts/verify_all.py --stage fast
        id: step-4
        background: true
      - name: Wait for verification legs
        wait: [step-3, step-4]

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: fast (3.15)
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
        id: step
        continue-on-error: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: true
        with:
          python-version: "3.15"
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
          cache-suffix: fast-3.15
      - run: uv sync --locked
        id: step-2
        continue-on-error: true
      - run: uv run python scripts/verify_all.py --stage docs
        id: step-3
        continue-on-error: true
      - run: uv run python scripts/verify_all.py --stage fast
        id: step-4
        continue-on-error: true
      - name: Report 3.15 canary outcome
        if: always() && (steps.step.outcome == 'failure' || steps.setup-uv.outcome == 'failure' || steps.step-2.outcome == 'failure' || steps.step-3.outcome == 'failure' || steps.step-4.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  # The standard stage is split into parallel legs; the docker-smoke
  # aggregator below keeps the required check name stable.
  standard-lint:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: standard-lint
      - run: uv run python scripts/verify_all.py --stage standard --group lint

  standard-unit:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: standard-unit
      # pytest --cov stays unsharded: the coverage floor only holds when the
      # whole suite runs in one leg. Docker-marked tests self-skip here.
      - run: uv run python scripts/verify_all.py --stage standard --group unit

  standard-smoke:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Legs rebuild the tools image whenever the cache misses; a slow mirror
    # window pushes them past 30 min (observed 2026-10-07).
    timeout-minutes: 45
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
      # The GHCR buildcache survives the gha cache's eviction window. The
      # cache lives as a `buildcache` tag on the public circuit-tools package
      # so anonymous pulls (local `docker buildx --cache-from`) reuse it too;
      # a separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages).
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx with the GitHub Actions cache avoids rebuilding the KiCad base
      # layers on every run; the lock-recorded image stays the publish target.
      - name: Build circuit-tools image
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load
            -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
            --build-arg "CERN_COMMIT=$CERN_COMMIT"
            --cache-from "type=gha,scope=circuit-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GHCR" = "true" ]; then
            args+=(--cache-to "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache,mode=max")
          else
            args+=(--cache-to "type=gha,mode=max,scope=circuit-tools,ignore-error=true")
          fi
          "${args[@]}" .
      - run: >-
          docker run --rm
          --user circuit
          -v "$PWD/fixtures/smoke-board:/work:ro"
          circuit-tools:ci
          python3 /opt/circuit/bin/smoke_kicad11_konnect.py

  standard-docker:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Same image build as standard-smoke: legs ran 17-30 min on 2026-10-07
    # and shard 0 hit the cap. Headroom, not speed, is the fix.
    timeout-minutes: 45
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils librsvg2-bin
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: standard-docker-${{ matrix.shard }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
      # The GHCR buildcache survives the gha cache's eviction window. The
      # cache lives as a `buildcache` tag on the public circuit-tools package
      # so anonymous pulls (local `docker buildx --cache-from`) reuse it too;
      # a separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages).
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every shard warms the image from the shared caches instead of
      # transferring it between jobs; a warm build costs ~1-2 minutes.
      - name: Build circuit-tools image
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load
            -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
            --build-arg "CERN_COMMIT=$CERN_COMMIT"
            --cache-from "type=gha,scope=circuit-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GHCR" = "true" ]; then
            args+=(--cache-to "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache,mode=max")
          else
            args+=(--cache-to "type=gha,mode=max,scope=circuit-tools,ignore-error=true")
          fi
          "${args[@]}" .
      - run: >-
          uv run python scripts/verify_all.py --stage standard
          --group docker --shard ${{ matrix.shard }}/4
        env:
          CIRCUIT_TOOLS_IMAGE: circuit-tools:ci

  docker-smoke:
    needs: [changes, standard-lint, standard-unit, standard-smoke, standard-docker]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Aggregation only: no checkout and no actions/cache usage.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Aggregate standard stage results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          legs = ("standard-lint", "standard-unit", "standard-smoke", "standard-docker")
          results = {name: needs[name]["result"] for name in legs}
          in_scope = (
              needs["changes"]["outputs"].get("docker") == "true"
              or os.environ["GITHUB_EVENT_NAME"] in ("push", "workflow_dispatch")
          )
          # Out of scope the legs are skipped by design; in scope every leg
          # must succeed so a skipped-leg-needs-failure cannot masquerade.
          expected = "success" if in_scope else "skipped"
          bad = {k: v for k, v in results.items() if v != expected}
          for name in legs:
              print(f"{name}: {results[name]}")
          if bad:
              print(f"::error::standard stage legs not {expected}: {bad}")
              sys.exit(1)
          PY

  real-part-mutation-shard:
    needs: [changes, fast]
    if: >-
      needs.changes.outputs.docker == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Writes the shared registry buildcache on push/dispatch runs; fork-PR
      # tokens are clamped to read-only regardless.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: real-part-mutation-${{ matrix.shard }}
      - run: uv sync --locked
      - name: Prepare corpus cache
        run: mkdir -p "$RUNNER_TEMP/corpus-cache" "$RUNNER_TEMP/real-part-mutation"
      - name: Restore TPS62130 datasheet cache
        id: corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-tps62130-f9b1af285622c0cf1a5991f9641a6e64c5e6d899e52cc0b1632808742019579f
      # The datasheet fetch only needs the restored cache dir — not the
      # image build — so it runs as a background leg joined before the
      # cache save and the mutation run that mount the cache.
      - name: Fetch and verify TPS62130 datasheet
        id: corpus-fetch
        background: true
        run: >-
          uv run python scripts/fetch_corpus_datasheet.py
          --entry tps62130-vqfn16
          --cache "$RUNNER_TEMP/corpus-cache"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: cern
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          echo "CERN_COMMIT=$cern_commit" >> "$GITHUB_ENV"
      # The GHCR buildcache survives the gha cache's eviction window. The
      # cache lives as a `buildcache` tag on the public circuit-tools package
      # so anonymous pulls (local `docker buildx --cache-from`) reuse it too;
      # a separate -buildcache package would default to private. The login is
      # skipped for fork PRs (their token cannot read packages).
      - name: Log in to GHCR for the registry build cache
        id: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build circuit-tools image
        env:
          GHCR: ${{ steps.ghcr-login.outcome == 'success' }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          args=(
            docker buildx build --load
            -f docker/circuit-tools.Dockerfile -t circuit-tools:ci
            --build-arg "CERN_COMMIT=$CERN_COMMIT"
            --cache-from "type=gha,scope=circuit-tools"
          )
          if [ "$GHCR" = "true" ]; then
            args+=(--cache-from "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache")
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GHCR" = "true" ]; then
            args+=(--cache-to "type=registry,ref=ghcr.io/$owner/circuit-tools:buildcache,mode=max")
          else
            args+=(--cache-to "type=gha,mode=max,scope=circuit-tools,ignore-error=true")
          fi
          "${args[@]}" .
      - name: Wait for datasheet fetch
        wait: corpus-fetch
      - name: Save TPS62130 datasheet cache
        # One shard writes the shared corpus entry; parallel saves race.
        if: steps.corpus-cache.outputs.cache-hit != 'true' && matrix.shard == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-tps62130-f9b1af285622c0cf1a5991f9641a6e64c5e6d899e52cc0b1632808742019579f
      - name: Run production mutation verifier in the tools image
        run: |
          set -euo pipefail
          chmod 0777 "$RUNNER_TEMP/real-part-mutation"
          docker run --rm --network none --user circuit \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/corpus-cache:/corpus-cache:ro" \
            -v "$RUNNER_TEMP/real-part-mutation:/out" \
            -w /repo \
            -e PYTHONPATH=/repo/src \
            -e CIRCUIT_REQUIRE_CORPUS_PDFS=1 \
            -e CIRCUIT_CORPUS_CACHE=/corpus-cache \
            circuit-tools:ci \
            python3 scripts/run_real_mutation_matrix.py \
              --entry tps62130-vqfn16 \
              --cache /corpus-cache \
              --out /out/tps62130-real-mutation-report.json \
              --export-oracle \
              --shard-index ${{ matrix.shard }} --num-shards 3
      - name: Upload real-part mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tps62130-real-mutation-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/real-part-mutation/tps62130-real-mutation-report.json
          if-no-files-found: ignore

  real-part-mutation:
    needs: [changes, real-part-mutation-shard]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Aggregation only: no checkout and no actions/cache usage.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Aggregate mutation shard results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          result = needs["real-part-mutation-shard"]["result"]
          in_scope = (
              needs["changes"]["outputs"].get("docker") == "true"
              or os.environ["GITHUB_EVENT_NAME"] in ("push", "workflow_dispatch")
          )
          expected = "success" if in_scope else "skipped"
          print(f"real-part-mutation-shard: {result}")
          if result != expected:
              print(f"::error::mutation shards not {expected}: {result}")
              sys.exit(1)
          PY

  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check plugin loads via SDK
        run: uv run python scripts/check_plugin_load.py
