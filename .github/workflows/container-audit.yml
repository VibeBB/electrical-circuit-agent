name: Container hardening audit

on:
  schedule:
    - cron: "22 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Pulls the pinned images from ghcr.io.
      packages: read
      # Uploads the Trivy SARIF scans to code scanning.
      security-events: write
      # Creates, edits, and closes the "Container hardening report" issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and pull pinned images
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          # One cache for every Trivy invocation in this job so the
          # vulnerability DB downloads once instead of once per scan.
          {
            echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache"
            echo "TRIVY_DB_WEEK=$(date -u +%G-W%V)"
          } >> "$GITHUB_ENV"
          # print_locked_image.py resolves the entry by key and fails
          # closed on a missing or non-digest-pinned lock entry.
          tools_ref=$(python3 scripts/print_locked_image.py --entry circuit_tools)
          server_ref=$(python3 scripts/print_locked_image.py --entry circuit_server)
          echo "PINNED_TOOLS_IMAGE=$tools_ref" >> "$GITHUB_ENV"
          echo "PINNED_SERVER_IMAGE=$server_ref" >> "$GITHUB_ENV"
          retry docker pull "$tools_ref"
          retry docker pull "$server_ref"
      - name: Restore Trivy vulnerability DB cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          # Restored/saved weekly like the publish workflow so the ~120MB
          # vulnerability DB is not refetched on every weekly audit.
          key: trivy-db-${{ env.TRIVY_DB_WEEK }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ env.TRIVY_DB_WEEK }}-
            trivy-db-
          fail-on-cache-miss: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Warm the Trivy DB for the raw-trivy scan legs
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        # Populate the raw-trivy legs' cache dir serially so those
        # legs only ever read the DB. The trivy-action legs restore
        # their own DB into per-leg cache-dir paths instead:
        # concurrent DB updates in one cache dir race on
        # db/metadata.json and corrupt it.
        run: trivy image --download-db-only
      # The scans read the same pinned image, each writes a disjoint
      # report path, and each trivy process writes to its own cache dir,
      # so they run as one parallel group (implicit wait at the end).
      - parallel:
          - name: Scan tools image (Trivy SARIF)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              cache-dir: ${{ runner.temp }}/trivy-cache-tools-sarif
              # The digest is frozen; the vulnerability DB is not — this scan
              # surfaces newly disclosed CVEs against the shipped tools image.
              scan-ref: ${{ env.PINNED_TOOLS_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig
              severity: CRITICAL,HIGH
              ignore-unfixed: true
              exit-code: '0'
              format: sarif
              output: trivy-circuit-tools.sarif
              limit-severities-for-sarif: true
              skip-setup-trivy: true
          - name: Scan tools image (Trivy JSON, full)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              cache-dir: ${{ runner.temp }}/trivy-cache-tools-json
              scan-ref: ${{ env.PINNED_TOOLS_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              list-all-pkgs: 'true'
              exit-code: '0'
              format: json
              output: trivy-circuit-tools.json
              skip-setup-trivy: true
          - name: Scan server image (Trivy SARIF)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              cache-dir: ${{ runner.temp }}/trivy-cache-server-sarif
              scan-ref: ${{ env.PINNED_SERVER_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig
              severity: CRITICAL,HIGH
              ignore-unfixed: true
              exit-code: '0'
              format: sarif
              output: trivy-circuit-server.sarif
              limit-severities-for-sarif: true
              skip-setup-trivy: true
          - name: Scan server image (Trivy JSON, full)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
              scan-type: image
              cache-dir: ${{ runner.temp }}/trivy-cache-server-json
              scan-ref: ${{ env.PINNED_SERVER_IMAGE }}
              version: v0.75.0
              scanners: vuln,secret,misconfig,license
              list-all-pkgs: 'true'
              exit-code: '0'
              format: json
              output: trivy-circuit-server.json
              skip-setup-trivy: true
          - name: Run Docker CIS compliance reports
            env:
              TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
            run: |
              set -euo pipefail
              run_cis() {
                local image="$1" out="$2" attempt
                for attempt in 1 2; do
                  # Trivy exits 0 even on the empty-results anomaly, so the
                  # retry keys on the MisconfSummary payload, not the exit
                  # code. The aggregation step stays fail-closed on empty.
                  if trivy image --compliance docker-cis-1.6.0 --include-non-failures --report all \
                    --ignorefile /dev/null --format json --output "$out" \
                    "$image" && \
                    python3 scripts/trivy_report_utils.py cis-nonempty "$out"; then
                    return 0
                  fi
                  echo "::warning::CIS report for $image returned no results (attempt $attempt)"
                  [ "$attempt" -lt 2 ] && sleep 15 || true
                done
                return 0
              }
              run_cis "${PINNED_TOOLS_IMAGE}" "$RUNNER_TEMP/trivy-cis-circuit-tools.json"
              run_cis "${PINNED_SERVER_IMAGE}" "$RUNNER_TEMP/trivy-cis-circuit-server.json"
          - name: Run informational Lynis audit inside the tools image
            id: lynis
            continue-on-error: true
            env:
              LYNIS_OUT: ${{ runner.temp }}/lynis-out
            run: |
              set -uo pipefail
              # Lynis 3.1.7 resolves to commit 2e99f92265760b73fd6b139868eb8d4116624030;
              # verify the checkout so a re-pointed tag fails instead of
              # silently auditing with different code.
              git clone --depth 1 --branch 3.1.7 \
                https://github.com/CISOfy/lynis "$RUNNER_TEMP/lynis"
              resolved=$(git -C "$RUNNER_TEMP/lynis" rev-parse HEAD)
              if [ "$resolved" != "2e99f92265760b73fd6b139868eb8d4116624030" ]; then
                echo "::error::Lynis 3.1.7 resolved to $resolved, expected 2e99f92265760b73fd6b139868eb8d4116624030"
                exit 1
              fi
              mkdir -p "$LYNIS_OUT"
              docker run --rm --user 0 \
                -v "$RUNNER_TEMP/lynis:/lynis:ro" \
                -v "$GITHUB_WORKSPACE/docker/lynis-container.prf:/container.prf:ro" \
                -v "$LYNIS_OUT:/out" \
                --entrypoint /bin/sh "$PINNED_TOOLS_IMAGE" \
                -c 'cd /lynis && ./lynis audit system --quick --no-colors \
                    --profile /container.prf \
                    --report-file /out/lynis-report.dat --logfile /out/lynis.log \
                    --auditor github-actions; \
                    chmod 644 /out/lynis-report.dat /out/lynis.log 2>/dev/null' || true
              # The audit is informational (continue-on-error) but a missing
              # report means the run was broken, not clean — mark it failed.
              test -s "$LYNIS_OUT/lynis-report.dat" || exit 1
              index=$(grep '^hardening_index=' "$LYNIS_OUT/lynis-report.dat" \
                | head -1 | cut -d= -f2 || true)
              warnings=$(grep -c '^warning\[\]' "$LYNIS_OUT/lynis-report.dat" || true)
              printf 'hardening_index=%s\nwarnings=%s\n' \
                "${index:-unknown}" "${warnings:-0}" >> "$GITHUB_OUTPUT"
      - name: Upload tools Trivy SARIF
        if: always() && hashFiles('trivy-circuit-tools.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-circuit-tools.sarif
          category: trivy-circuit-tools-audit
      - name: Upload server Trivy SARIF
        if: always() && hashFiles('trivy-circuit-server.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-circuit-server.sarif
          category: trivy-circuit-server-audit
      - name: Compute container-hardening report
        env:
          LYNIS_OUT: ${{ runner.temp }}/lynis-out
          TRIVY_JSON_TOOLS: trivy-circuit-tools.json
          TRIVY_JSON_SERVER: trivy-circuit-server.json
          TRIVY_CIS_TOOLS: ${{ runner.temp }}/trivy-cis-circuit-tools.json
          TRIVY_CIS_SERVER: ${{ runner.temp }}/trivy-cis-circuit-server.json
          REPORT_JSON: container-hardening.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from collections import Counter
          from datetime import datetime, timezone

          from scripts.trivy_report_utils import cis_summary_totals

          def image_block(image_ref, trivy_path, cis_path):
              trivy = json.load(open(trivy_path, encoding="utf-8"))
              vulns, secrets, licenses = Counter(), Counter(), 0
              mis_pass = mis_total = fixable_high = 0
              for result in trivy.get("Results", []):
                  for v in result.get("Vulnerabilities") or []:
                      sev = v.get("Severity", "UNKNOWN").lower()
                      vulns[sev] += 1
                      if v.get("FixedVersion"):
                          vulns[f"{sev}_fixed"] += 1
                          if sev in ("critical", "high"):
                              fixable_high += 1
                  for m in result.get("Misconfigurations") or []:
                      mis_total += 1
                      if m.get("Status") == "PASS":
                          mis_pass += 1
                  for s in result.get("Secrets") or []:
                      secrets[s.get("Severity", "UNKNOWN").lower()] += 1
                  for lic in result.get("Licenses") or []:
                      licenses += 1
              try:
                  cis_data = json.load(open(cis_path, encoding="utf-8"))
              except (OSError, ValueError):
                  cis_data = {}
              # --compliance nests check summaries deeper than top-level
              # Results; the recursive walk totals the real summaries.
              cis = cis_summary_totals(cis_data) if cis_data else {"passed": 0, "failed": 0}
              if cis["passed"] + cis["failed"] == 0:
                  # dead telemetry must fail, not masquerade as coverage
                  sys.exit("Docker CIS scan produced no results")
              image, _, digest = image_ref.partition("@")
              return {
                  "image": image,
                  "digest": digest,
                  "trivy": {
                      "critical": vulns["critical"],
                      "high": vulns["high"],
                      "medium": vulns["medium"],
                      "low": vulns["low"],
                      "fixable_high_or_critical": fixable_high,
                      "misconfig_pass": mis_pass,
                      "misconfig_total": mis_total,
                      "secrets": sum(secrets.values()),
                      "license_findings": licenses,
                  },
                  "cis_docker": cis,
              }

          images = {}
          fixable_total = 0
          for name, ref_env, trivy_env, cis_env in (
              ("circuit-tools", "PINNED_TOOLS_IMAGE",
               "TRIVY_JSON_TOOLS", "TRIVY_CIS_TOOLS"),
              ("circuit-server", "PINNED_SERVER_IMAGE",
               "TRIVY_JSON_SERVER", "TRIVY_CIS_SERVER"),
          ):
              block = image_block(os.environ[ref_env],
                                  os.environ[trivy_env], os.environ[cis_env])
              images[name] = block
              fixable_total += block["trivy"]["fixable_high_or_critical"]
          lynis = {"hardening_index": "unknown", "warnings": 0}
          try:
              for line in open(os.environ["LYNIS_OUT"] + "/lynis-report.dat",
                               encoding="utf-8", errors="replace"):
                  if line.startswith("hardening_index="):
                      lynis["hardening_index"] = line.split("=", 1)[1].strip()
                  elif line.startswith("warning[]"):
                      lynis["warnings"] += 1
          except OSError:
              pass
          report = {
              "images": images,
              "lynis": lynis,
              "gate": {"fixable_high_or_critical": fixable_total},
              "computed_at": datetime.now(timezone.utc).isoformat(),
          }
          with open(os.environ["REPORT_JSON"], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload tools Trivy JSON report
        if: always() && hashFiles('trivy-circuit-tools.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-tools-trivy-audit
          path: trivy-circuit-tools.json
          retention-days: 90
      - name: Upload server Trivy JSON report
        if: always() && hashFiles('trivy-circuit-server.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-server-trivy-audit
          path: trivy-circuit-server.json
          retention-days: 90
      - name: Upload hardening report
        if: always() && hashFiles('container-hardening.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-hardening
          path: container-hardening.json
          retention-days: 90
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_JSON: container-hardening.json
          REPORT_MD: ${{ runner.temp }}/hardening-report.md
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$REPORT_MD"
          import json, os
          r = json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))
          print("# Container hardening report\n")
          print("| Image | Trivy vulns C/H/M/L | Fixable HIGH+CRITICAL "
                "| Misconfig pass | Secrets | CIS Docker pass/fail |")
          print("|---|---|---|---|---|---|")
          for name, block in sorted(r["images"].items()):
              t = block["trivy"]
              cis = block["cis_docker"]
              print(f"| `{name}` | "
                    f"{t['critical']}/{t['high']}/{t['medium']}/{t['low']} | "
                    f"{t['fixable_high_or_critical']} | "
                    f"{t['misconfig_pass']}/{t['misconfig_total']} | "
                    f"{t['secrets']} | "
                    f"{cis['passed']}/{cis['failed']} |")
          print(f"\nDigest: `{r['images']['circuit-tools']['digest']}` "
                f"(tools), `{r['images']['circuit-server']['digest']}` (server)\n")
          print(f"- Lynis hardening index (trend only, tools image): "
                f"{r['lynis']['hardening_index']}")
          print(f"- Lynis warnings: {r['lynis']['warnings']}")
          print(f"\nRun: {os.environ['GITHUB_SERVER_URL']}/"
                f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                f"{os.environ['GITHUB_RUN_ID']}")
          PY
          gh label create container-hardening --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Container hardening report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label container-hardening \
            --search "in:title Container hardening report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MD"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Container hardening report" \
              --label container-hardening --body-file "$REPORT_MD" | sed 's#.*/##')
          fi
          gate=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_JSON"], encoding="utf-8"))["gate"]["fixable_high_or_critical"])')
          if [ "$gate" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "No fixable HIGH/CRITICAL findings remain."
          fi
      - name: Save Trivy vulnerability DB cache
        if: github.ref_name == 'main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          # Saved after all scans so the refreshed DB stays warm for later
          # runs; the weekly restore-keys rotate the baseline once per ISO
          # week. Dispatched runs on a branch restore but never write.
          key: trivy-db-${{ env.TRIVY_DB_WEEK }}-${{ github.run_id }}
