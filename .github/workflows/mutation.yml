name: Mutation probe

# Advisory: survivors never fail the run. A failing unmutated baseline
# does, because no score can be trusted then (docs/test-coverage.md).
on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # No actions/cache usage: forbid restore and save entirely (setup-uv
    # below already runs with enable-cache: false).
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run the mutation probe
        run: uv run python scripts/mutation_probe.py run --json out/mutation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-probe
          path: out/mutation.json
          retention-days: 30
          if-no-files-found: ignore
