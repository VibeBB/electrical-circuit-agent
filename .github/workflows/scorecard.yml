name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # publish_results is verified server-side: the job running
    # scorecard-action may only contain `uses:` steps, so all
    # post-processing (SARIF normalization + upload) lives in `report`.
    permissions:
      contents: read # actions/checkout
      actions: read # reads workflow runs for the CI-tests check
      id-token: write # publishes results to the OpenSSF API
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

  report:
    needs: analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # actions/download-artifact workspace
      actions: read # downloads the analysis artifact
      security-events: write # uploads the SARIF report to code scanning
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-sarif
      - name: Normalize scorecard SARIF locations
        # Alerts with no associated file carry the literal string
        # "no file associated with this alert" as their artifact URI, which
        # the SARIF uploader warns about on every run. Drop those locations
        # (upstream workaround, ossf/scorecard#3063).
        run: |
          python3 - <<'PY'
          import json, os
          with open("results.sarif", encoding="utf-8") as fh:
              data = json.load(fh)
          count = 0
          for run in data.get("runs", []):
              kept_results = []
              for result in run.get("results", []):
                  locations = [
                      loc
                      for loc in result.get("locations", [])
                      if loc.get("physicalLocation", {})
                      .get("artifactLocation", {})
                      .get("uri")
                      != "no file associated with this alert"
                  ]
                  result["locations"] = locations
                  if locations:
                      kept_results.append(result)
                  else:
                      # Code scanning requires >=1 location per result;
                      # repo-level alerts keep none after filtering.
                      count += 1
              run["results"] = kept_results
          tmp = "results.sarif.normalized"
          with open(tmp, "w", encoding="utf-8") as fh:
              json.dump(data, fh)
          os.replace(tmp, "results.sarif")
          print(f"dropped {count} location-less scorecard result(s)")
          PY
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
