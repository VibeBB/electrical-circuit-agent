name: PR branch cleanup

# Deletes automation-owned head branches when their pull request closes, and
# sweeps leftovers daily. The publish and release workflows merge their
# digest-lock / version-bump pull requests via `gh pr merge --auto --squash
# --delete-branch`; when the merge is only *armed* and lands after the
# workflow run exits, nothing deletes the head branch (the repository's
# "delete head branches on merge" setting stays off). This covers that gap
# without touching human-owned branches.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # git ref deletion
      pull-requests: read # the sweep checks for open pull requests
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Delete the closed pull request's automation branch
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (startsWith(github.event.pull_request.head.ref, 'bot/')
            || startsWith(github.event.pull_request.head.ref, 'devin/')
            || startsWith(github.event.pull_request.head.ref, 'dependabot/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The merge may have already deleted the branch; keep the raw 422
          # JSON off the log so it does not mask real failures. --silent hides
          # the error body gh api writes to stdout.
          if ! gh api --silent -X DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2>/dev/null; then
            echo "branch $BRANCH is already gone"
          fi
      - name: Sweep automation branches with no open pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate \
            --jq '.[].name' | grep -E '^(bot/|devin/|dependabot/)' > branches.txt || true
          while IFS= read -r branch; do
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --head "$branch" --json number --jq 'length')
            if [ "$open" != "0" ]; then
              continue
            fi
            # A bot branch can briefly exist before its pull request is
            # opened; skip branches whose tip commit is younger than 10 min.
            ts=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" \
              --jq '.commit.committer.date' 2>/dev/null || echo "")
            if [ -n "$ts" ] \
                && [ "$(( $(date +%s) - $(date -d "$ts" +%s) ))" -lt 600 ]; then
              echo "skipping new branch $branch"
              continue
            fi
            if gh api --silent -X DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" 2>/dev/null; then
              echo "deleted stale branch $branch"
            else
              echo "failed to delete $branch"
            fi
          done < branches.txt
