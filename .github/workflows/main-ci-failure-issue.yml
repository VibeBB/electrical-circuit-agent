name: Main CI failure issue

on:
  # zizmor: ignore[dangerous-triggers] reads run metadata only; it never checks
  # out or executes the triggering run's code, so workflow_run is safe here.
  workflow_run:
    workflows: ["CI", "Publish circuit images", "Locked image check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: main-ci-failure-issue
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh label create ci-main-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "mainのCIまたはimage検証が失敗している" || true
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-main-failure \
            --json number --jq '.[0].number // empty')
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "緑に戻りました: $RUN_URL"; fi
            exit 0
          fi
          if [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = skipped ]; then exit 0; fi
          jobs=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')
          body=$(printf '%s\n\n- run: %s\n- failed jobs: %s\n' "mainのCI/image検証が失敗しました。" "$RUN_URL" "${jobs:-不明}")
          if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "main CI失敗レポート" --label ci-main-failure --body "$body"
          fi
