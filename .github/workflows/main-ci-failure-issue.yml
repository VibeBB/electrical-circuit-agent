name: Main CI failure issue

on:
  # zizmor: ignore[dangerous-triggers] files a tracking Issue on completed main runs; no code is checked out
  workflow_run:
    workflows:
      - "CI"
      - "Cache sweep"
      - "GHCR tag retention"
      - "Container hardening audit"
      - "Digest lock PR sweep"
      - "Check dependency updates"
      - "Locked image check"
      - "Mutation probe"
      - "PR branch cleanup"
      - "Publish circuit images"
      - "Release"
      - "Scorecard"
      - "Workflow lint"
      - "CodeQL"
    types: [completed]
    branches: [main]
  # Runs dispatched with GITHUB_TOKEN (post-merge digest-lock verification)
  # never emit a workflow_run event, so a scheduled reconcile closes failure
  # issues whose workflow is already green on main.
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-failure-issue-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the completed run's jobs
      contents: read
      # Files, comments on, and closes the main CI failure tracking issue.
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          gh_retry() {
            # gh calls occasionally hit transient gateway errors (5xx);
            # retry with backoff so a flake cannot kill the tracker.
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              sleep $((attempt * 5))
            done
            return 1
          }
          gh label create ci-main-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "a main-branch workflow is failing" --force || true
          title="main CI failure: $WORKFLOW_NAME"
          issue_for() {
            gh_retry gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-main-failure \
              --limit 100 --json number,title \
              --jq "[.[] | select(.title == \"$1\")] | .[0].number // empty"
          }
          if [ "$CONCLUSION" = success ]; then
            issue=$(issue_for "$title")
            if [ -n "$issue" ]; then
              gh_retry gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Back to green: $RUN_URL"
            fi
            issue=$(issue_for "main CI failure report")
            if [ -n "$issue" ]; then
              gh_retry gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Back to green: $RUN_URL"
            fi
            exit 0
          fi
          if [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = skipped ]; then
            exit 0
          fi
          jobs=$(gh_retry gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')
          body=$(printf '%s\n\n- workflow: %s\n- run: %s\n- failed jobs: %s\n' "A main-branch workflow failed." "$WORKFLOW_NAME" "$RUN_URL" "${jobs:-unknown}")
          issue=$(issue_for "$title")
          if [ -n "$issue" ]; then
            gh_retry gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh_retry gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ci-main-failure --body "$body"
          fi

  reconcile:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # reads the latest main run per watched workflow
      contents: read
      # Closes failure issues whose workflow's latest main run is green.
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Close failure issues whose workflow is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_retry() {
            # gh calls occasionally hit transient gateway errors (5xx);
            # retry with backoff so a flake cannot kill the tracker.
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              sleep $((attempt * 5))
            done
            return 1
          }
          gh_retry gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label ci-main-failure --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' > "$RUNNER_TEMP/issues.txt"
          while IFS=$'\t' read -r number title; do
            case "$title" in
              "main CI failure: "*) workflow=${title#main CI failure: } ;;
              *) continue ;;
            esac
            conclusion=$(gh_retry gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --branch main --limit 1 \
              --json conclusion --jq '.[0].conclusion // empty' || true)
            if [ "$conclusion" = "success" ]; then
              gh_retry gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "Back to green on main: the latest '$workflow' run succeeded."
            fi
          done < "$RUNNER_TEMP/issues.txt"
