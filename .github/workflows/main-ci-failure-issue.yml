name: Main CI failure issue

on:
  # zizmor: ignore[dangerous-triggers] files a tracking Issue on completed main runs; no code is checked out
  workflow_run:
    workflows: ["CI", "Publish circuit images", "Locked image check", "Workflow lint"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci-failure-issue
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # list runs and jobs for the failed workflow
      issues: write # file and close the main CI failure tracking Issue
    steps:
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh label create ci-main-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Main CI or image verification is failing" --force || true
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-main-failure \
            --json number --jq '.[0].number // empty')
          if [ "$CONCLUSION" = success ]; then
            if [ -n "$issue" ]; then gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Back to green: $RUN_URL"; fi
            exit 0
          fi
          if [ "$CONCLUSION" = cancelled ] || [ "$CONCLUSION" = skipped ]; then exit 0; fi
          jobs=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")')
          body=$(printf '%s\n\n- run: %s\n- failed jobs: %s\n' "Main CI/image verification failed." "$RUN_URL" "${jobs:-unknown}")
          if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"; else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Main CI failure report" --label ci-main-failure --body "$body"
          fi
