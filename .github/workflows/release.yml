name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: "Explicit X.Y.Z override; leave empty to bump"
        required: false
        type: string
      dry_run:
        description: "Rehearse the flow without pushing, merging, tagging, or releasing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-26.04
    # Covers the slow path: direct-push rejection → bump PR + dispatched
    # checks + merge wait. The dispatched ci.yml runs this repo's full e2e
    # matrix (~40 min observed), which exceeds a 45-minute budget once the
    # merge wait is added — the v1.0.0 run was cancelled at the cap with its
    # bump PR left open. 120 matches the dashboard release.
    timeout-minutes: 120
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      actions: write # approve gated pull_request runs and dispatch ci.yml checks
      contents: write # push the version bump to main or a bot branch
      pull-requests: write # open and merge the version-bump PR fallback
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version files
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release_bump.sh

  verify:
    needs: bump-version
    # The caller's permissions cap the called workflow's token; ci.yml's
    # docker jobs request packages:write for the shared registry buildcache,
    # so the grant must cover it or the expanded graph fails dispatch-time
    # validation with a startup_failure.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] same-repo reuse
    with:
      ref: ${{ needs.bump-version.outputs.sha }}

  install-smoke:
    needs: bump-version
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Smoke-test remote install
        env:
          REF: ${{ needs.bump-version.outputs.sha }}
        run: >
          uv run python scripts/smoke_install_plugin.py
          --repo VibeBB/electrical-circuit-agent --ref "$REF" --repo-path plugins/circuit

  release:
    needs: [bump-version, verify, install-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      contents: write # create the release tag and GitHub release
    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      SHA: ${{ needs.bump-version.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false
      - name: Build release zip
        run: |
          mkdir -p dist
          (cd plugins && zip -r "../dist/circuit-plugin-v${VERSION}.zip" circuit)
      - name: Create release and tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          retry gh release create "v${VERSION}" --target "$SHA" \
            --title "circuit v${VERSION}" --generate-notes dist/*.zip
      - name: Report dry run
        if: inputs.dry_run == true
        run: |
          echo "dry run: release zip built for v${VERSION} at ${SHA}; tag and GitHub release creation were skipped" >> "$GITHUB_STEP_SUMMARY"
