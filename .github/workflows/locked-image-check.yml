name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
      server_image: ${{ steps.server.outputs.image }}
      server_digest: ${{ steps.server.outputs.digest }}
      server_attestation: ${{ steps.server.outputs.attestation }}
      server_sbom_attestation: ${{ steps.server.outputs.sbom_attestation }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          lock_path = Path("docker/image-digests.json")
          present = "false"
          image = ""
          digest = ""
          attestation = ""
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              if not isinstance(lock, dict):
                  raise SystemExit("image lock must be a JSON object")
              entry = lock.get("circuit_tools")
              if not isinstance(entry, dict):
                  raise SystemExit("image lock must contain a circuit_tools object")
              if entry.get("image") != "ghcr.io/vibebb/circuit-tools":
                  raise SystemExit(
                      "circuit_tools image does not match ghcr.io/vibebb/circuit-tools"
                  )
              if "digest" not in entry or "tag" not in entry:
                  raise SystemExit("circuit_tools lock must contain digest and tag fields")
              digest = entry["digest"]
              tag = entry["tag"]
              if digest is None and tag is None:
                  if entry.get("attestation") is not None:
                      raise SystemExit(
                          "circuit_tools attestation cannot exist without a pinned image"
                      )
              else:
                  if (
                      not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                      or digest == f"sha256:{'0' * 64}"
                  ):
                      raise SystemExit("circuit_tools digest must be null or a sha256 digest")
                  if (
                      not isinstance(tag, str)
                      or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None
                  ):
                      raise SystemExit(
                          "circuit_tools tag must be null or a 40-character tools tag"
                      )
                  present = "true"
                  image = entry["image"]
                  attestation_value = entry.get("attestation")
                  if attestation_value is not None:
                      parsed = (
                          urlsplit(attestation_value)
                          if isinstance(attestation_value, str)
                          else None
                      )
                      if (
                          parsed is None
                          or parsed.scheme != "https"
                          or not parsed.netloc
                          or any(character.isspace() for character in attestation_value)
                      ):
                          raise SystemExit("circuit_tools attestation must be an HTTPS URL")
                      attestation = attestation_value
              digest = digest if present == "true" else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={present}\n")
              output.write(f"image={image}\n")
              output.write(f"digest={digest}\n")
              output.write(f"attestation={attestation}\n")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: circuit_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
      - id: server
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: circuit_server
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          def https_url(value, field):
              if value is None:
                  return ""
              parsed = urlsplit(value) if isinstance(value, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in value)
              ):
                  raise SystemExit(f"circuit_server {field} must be an HTTPS URL")
              return value

          path = Path(os.environ["LOCK_PATH"])
          present = "false"
          image = ""
          digest = ""
          attestation = ""
          sbom_attestation = ""
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
              if entry is not None:
                  if not isinstance(entry, dict):
                      raise SystemExit("circuit_server lock entry must be an object")
                  if entry.get("image") != "ghcr.io/vibebb/circuit-server":
                      raise SystemExit(
                          "circuit_server image does not match ghcr.io/vibebb/circuit-server"
                      )
                  digest_value = entry.get("digest")
                  tag = entry.get("tag")
                  if digest_value is None and tag is None:
                      if entry.get("attestation") is not None or entry.get("sbom_attestation") is not None:
                          raise SystemExit(
                              "unpublished circuit_server entry cannot have attestation metadata"
                          )
                  else:
                      if (
                          not isinstance(digest_value, str)
                          or re.fullmatch(r"sha256:[0-9a-f]{64}", digest_value) is None
                          or digest_value == f"sha256:{'0' * 64}"
                      ):
                          raise SystemExit("circuit_server digest must be null or a sha256 digest")
                      if (
                          not isinstance(tag, str)
                          or re.fullmatch(r"[0-9a-f]{40}-latest-source", tag) is None
                      ):
                          raise SystemExit(
                              "circuit_server tag must be null or a latest-source tag"
                          )
                      present = "true"
                      image = entry["image"]
                      digest = digest_value
                      attestation = https_url(entry.get("attestation"), "attestation")
                      sbom_attestation = https_url(
                          entry.get("sbom_attestation"), "sbom_attestation"
                      )
          print(f"present={present}")
          print(f"image={image}")
          print(f"digest={digest}")
          print(f"attestation={attestation}")
          print(f"sbom_attestation={sbom_attestation}")
          PY
  # The locked-image verification is split into parallel legs; the check
  # aggregator at the end keeps the required check name stable.
  check-attest:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # No actions/cache usage: forbid restore and save entirely.
    cache-mode: none
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The eight attestation checks only read the lock outputs — the
      # fail-closed/verify pairs are mutually exclusive per `if:` — so they
      # run as one parallel group (implicit wait at the end).
      - parallel:
          - name: Fail when tools image has no attestation metadata
            # Publish always emits attestations now; a lock without them means
            # the attestation stage silently regressed — fail closed rather
            # than skip provenance verification.
            if: needs.check-lock.outputs.attestation == ''
            run: |
              echo "::error::circuit_tools image lock has no attestation metadata; the publish workflow must emit provenance attestations."
              exit 1
          - name: Verify tools image provenance
            if: needs.check-lock.outputs.attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml"
          - name: Fail when tools image has no SBOM attestation
            if: needs.check-lock.outputs.sbom_attestation == ''
            run: |
              echo "::error::circuit_tools image lock has no SBOM attestation; the publish workflow must emit SBOM attestations."
              exit 1
          - name: Verify tools image SBOM attestation
            if: needs.check-lock.outputs.sbom_attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.image }}
              DIGEST: ${{ needs.check-lock.outputs.digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml" \
                --predicate-type https://spdx.dev/Document/v2.3
          - name: Fail when server image has no attestation metadata
            if: needs.check-lock.outputs.server_attestation == ''
            run: |
              echo "::error::circuit_server image lock has no attestation metadata; the publish workflow must emit provenance attestations."
              exit 1
          - name: Verify server image provenance
            if: needs.check-lock.outputs.server_attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.server_image }}
              DIGEST: ${{ needs.check-lock.outputs.server_digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml"
          - name: Fail when server image has no SBOM attestation
            if: needs.check-lock.outputs.server_sbom_attestation == ''
            run: |
              echo "::error::circuit_server image lock has no SBOM attestation; the publish workflow must emit SBOM attestations."
              exit 1
          - name: Verify server image SBOM attestation
            if: needs.check-lock.outputs.server_sbom_attestation != ''
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ${{ needs.check-lock.outputs.server_image }}
              DIGEST: ${{ needs.check-lock.outputs.server_digest }}
            run: |
              gh attestation verify "oci://${IMAGE}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml" \
                --predicate-type https://spdx.dev/Document/v2.3
  check-smoke:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-check-smoke
      - run: uv sync --locked
      - run: uv run python scripts/pull_locked_image.py --entry circuit_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry circuit_tools)" >> "$GITHUB_OUTPUT"
      # Both smokes only need the pulled image and write disjoint paths,
      # so they run as a parallel group.
      - parallel:
          - name: Smoke locked image
            env:
              IMAGE_REF: ${{ steps.image.outputs.ref }}
            run: docker run --rm --user circuit -v "$PWD/fixtures/smoke-board:/work:ro" "$IMAGE_REF" python3 /opt/circuit/bin/smoke_kicad11_konnect.py
          - name: Smoke locked image through the plugin launcher
            env:
              CIRCUIT_VERIFY_ATTESTATION: ${{ needs.check-lock.outputs.attestation != '' && 'require' || 'auto' }}
              GH_TOKEN: ${{ github.token }}
              OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
              SMOKE_OUT: ${{ github.workspace }}/circuit-smoke-out
            run: |
              set -euo pipefail
              mkdir -p "$SMOKE_OUT"
              launcher=plugins/circuit/scripts/circuit_launcher.py
              python3 "$launcher" prewarm
              python3 "$launcher" doctor > "$SMOKE_OUT/doctor.json"
              set +e
              python3 "$launcher" author \
                --brief tests/data/brief_led_loop.json \
                --intake tests/data/brief_led_loop.intake.json \
                --workdir "$SMOKE_OUT/authoring" \
                > "$SMOKE_OUT/author.stdout.json"
              author_status=$?
              set -e
              python3 - "$SMOKE_OUT" "$author_status" <<'PY'
              import json
              import sys
              from pathlib import Path

              out = Path(sys.argv[1])
              author_status = int(sys.argv[2])
              workdir = out / "authoring"
              report_path = workdir / "circuit-reports" / "design-report.json"
              if report_path.is_file():
                  raw_report = report_path.read_text(encoding="utf-8")
                  try:
                      report = json.loads(raw_report)
                  except json.JSONDecodeError:
                      print(raw_report)
                      report = {}
                  if isinstance(report, dict):
                      for name in ("connectivity", "erc", "drc"):
                          gate = report.get(name)
                          verdict = gate.get("verdict") if isinstance(gate, dict) else "missing"
                          print(f"{name}: {verdict}")
                  else:
                      print(raw_report)
              else:
                  print((out / "author.stdout.json").read_text(encoding="utf-8"))
                  report = {}
              result_path = workdir / "e2e-authoring.json"
              result = (
                  json.loads(result_path.read_text(encoding="utf-8"))
                  if result_path.is_file()
                  else {}
              )
              gates_pass = all(
                  isinstance(report.get(name), dict)
                  and report[name].get("verdict") == "pass"
                  for name in ("connectivity", "erc", "drc")
              )
              if (
                  author_status != 0
                  or report.get("verdict") != "pass"
                  or not gates_pass
                  or result.get("verdict") != "pass"
              ):
                  raise SystemExit("circuit launcher authoring smoke did not pass")
              PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: locked-circuit-launcher-smoke
          path: ${{ github.workspace }}/circuit-smoke-out/
          if-no-files-found: ignore
          retention-days: 14

  check-lint:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-check-lint
      - run: uv run python scripts/verify_all.py --stage standard --group lint

  check-unit:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install host rasterizer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-check-unit
      - run: uv run python scripts/verify_all.py --stage standard --group unit

  check-docker:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install host rasterizer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils librsvg2-bin
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: locked-check-docker-${{ matrix.shard }}
      - run: uv sync --locked
      - name: Preflight host rasterizer tools
        # verify_all --stage standard rasterizes via poppler/rsvg on the
        # host; surface a missing tool as a setup error, not a deep
        # RasterizeError minutes into the stage.
        run: |
          command -v pdftoppm
          command -v rsvg-convert
      - run: uv run python scripts/pull_locked_image.py --entry circuit_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry circuit_tools)" >> "$GITHUB_OUTPUT"
      - run: >-
          uv run python scripts/verify_all.py --stage standard
          --group docker --shard ${{ matrix.shard }}/4
        env:
          CIRCUIT_TOOLS_IMAGE: ${{ steps.image.outputs.ref }}

  check:
    needs: [check-lock, check-attest, check-lint, check-unit, check-docker, check-smoke]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Aggregation only: no checkout and no actions/cache usage.
    cache-mode: none
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Aggregate locked-image check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          lock = needs["check-lock"]
          if lock["result"] != "success":
              print(f"::error::check-lock did not succeed: {lock['result']}")
              sys.exit(1)
          legs = ("check-attest", "check-lint", "check-unit", "check-docker", "check-smoke")
          results = {name: needs[name]["result"] for name in legs}
          # With no locked image the legs are skipped by design; with a lock
          # every leg must succeed.
          expected = "success" if lock["outputs"].get("present") == "true" else "skipped"
          bad = {k: v for k, v in results.items() if v != expected}
          for name in legs:
              print(f"{name}: {results[name]}")
          if bad:
              print(f"::error::locked-image legs not {expected}: {bad}")
              sys.exit(1)
          PY
