name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          if [ -s docker/image-digests.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/pull_locked_image.py --entry circuit_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry circuit_tools)" >> "$GITHUB_OUTPUT"
      - name: Smoke locked image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker run --rm --user circuit -v "$PWD/fixtures/smoke-board:/work:ro" "$IMAGE_REF" python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - run: uv run python scripts/verify_all.py --stage standard
        env:
          CIRCUIT_TOOLS_IMAGE: ${{ steps.image.outputs.ref }}
