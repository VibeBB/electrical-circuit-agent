name: Locked image check

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: locked-image-check
  cancel-in-progress: false

jobs:
  check-lock:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      present: ${{ steps.lock.outputs.present }}
      image: ${{ steps.lock.outputs.image }}
      digest: ${{ steps.lock.outputs.digest }}
      attestation: ${{ steps.lock.outputs.attestation }}
      sbom_attestation: ${{ steps.sbom.outputs.sbom_attestation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          lock_path = Path("docker/image-digests.json")
          present = "false"
          image = ""
          digest = ""
          attestation = ""
          if lock_path.exists():
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              if not isinstance(lock, dict):
                  raise SystemExit("image lock must be a JSON object")
              entry = lock.get("circuit_tools")
              if not isinstance(entry, dict):
                  raise SystemExit("image lock must contain a circuit_tools object")
              if entry.get("image") != "ghcr.io/vibebb/circuit-tools":
                  raise SystemExit(
                      "circuit_tools image does not match ghcr.io/vibebb/circuit-tools"
                  )
              if "digest" not in entry or "tag" not in entry:
                  raise SystemExit("circuit_tools lock must contain digest and tag fields")
              digest = entry["digest"]
              tag = entry["tag"]
              if digest is None and tag is None:
                  if entry.get("attestation") is not None:
                      raise SystemExit(
                          "circuit_tools attestation cannot exist without a pinned image"
                      )
              else:
                  if (
                      not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                      or digest == f"sha256:{'0' * 64}"
                  ):
                      raise SystemExit("circuit_tools digest must be null or a sha256 digest")
                  if (
                      not isinstance(tag, str)
                      or re.fullmatch(r"[0-9a-f]{40}-tools", tag) is None
                  ):
                      raise SystemExit(
                          "circuit_tools tag must be null or a 40-character tools tag"
                      )
                  present = "true"
                  image = entry["image"]
                  attestation_value = entry.get("attestation")
                  if attestation_value is not None:
                      parsed = (
                          urlsplit(attestation_value)
                          if isinstance(attestation_value, str)
                          else None
                      )
                      if (
                          parsed is None
                          or parsed.scheme != "https"
                          or not parsed.netloc
                          or any(character.isspace() for character in attestation_value)
                      ):
                          raise SystemExit("circuit_tools attestation must be an HTTPS URL")
                      attestation = attestation_value
              digest = digest if present == "true" else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"present={present}\n")
              output.write(f"image={image}\n")
              output.write(f"digest={digest}\n")
              output.write(f"attestation={attestation}\n")
          PY
      - id: sbom
        env:
          LOCK_PATH: docker/image-digests.json
          LOCK_ENTRY: circuit_tools
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["LOCK_PATH"])
          entry = None
          if path.is_file():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit("image digest lock must be a JSON object")
              entry = data.get(os.environ["LOCK_ENTRY"])
          if entry is not None and not isinstance(entry, dict):
              raise SystemExit("image lock entry must be an object")
          sbom_attestation = entry.get("sbom_attestation") if entry else None
          if entry and entry.get("digest") is None and entry.get("tag") is None:
              if sbom_attestation is not None:
                  raise SystemExit("unpublished image entry cannot have an SBOM attestation")
              sbom_attestation = ""
          elif sbom_attestation is not None:
              parsed = urlsplit(sbom_attestation) if isinstance(sbom_attestation, str) else None
              if (
                  parsed is None
                  or parsed.scheme != "https"
                  or not parsed.netloc
                  or any(character.isspace() for character in sbom_attestation)
              ):
                  raise SystemExit("image lock SBOM attestation must be an HTTPS URL")
          print(f"sbom_attestation={sbom_attestation or ''}")
          PY
  check:
    needs: check-lock
    if: needs.check-lock.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: locked-image-check
      - name: Install host rasterizer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils librsvg2-bin
      - run: uv sync --locked
      - name: Warn that tools image has no attestation metadata
        if: needs.check-lock.outputs.attestation == ''
        run: echo "::warning::circuit_tools image lock has no attestation metadata; skipping provenance verification."
      - name: Verify tools image provenance
        if: needs.check-lock.outputs.attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml"
      - name: Warn when tools image has no SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation == ''
        run: echo "::warning::circuit_tools image lock has no SBOM attestation; continuing"
      - name: Verify tools image SBOM attestation
        if: needs.check-lock.outputs.sbom_attestation != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.check-lock.outputs.image }}
          DIGEST: ${{ needs.check-lock.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-circuit-images.yml" \
            --predicate-type https://spdx.dev/Document/v2.3
      - run: uv run python scripts/pull_locked_image.py --entry circuit_tools
      - id: image
        run: echo "ref=$(uv run python scripts/print_locked_image.py --entry circuit_tools)" >> "$GITHUB_OUTPUT"
      - name: Smoke locked image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker run --rm --user circuit -v "$PWD/fixtures/smoke-board:/work:ro" "$IMAGE_REF" python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - name: Smoke locked image through the plugin launcher
        env:
          CIRCUIT_VERIFY_ATTESTATION: ${{ needs.check-lock.outputs.attestation != '' && 'require' || 'auto' }}
          GH_TOKEN: ${{ github.token }}
          OPENHANDS_PROJECT_DIR: ${{ github.workspace }}
          SMOKE_OUT: ${{ github.workspace }}/circuit-smoke-out
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_OUT"
          launcher=plugins/circuit/scripts/circuit_launcher.py
          python3 "$launcher" prewarm
          python3 "$launcher" doctor > "$SMOKE_OUT/doctor.json"
          set +e
          python3 "$launcher" author \
            --brief tests/data/brief_led_loop.json \
            --intake tests/data/brief_led_loop.intake.json \
            --workdir "$SMOKE_OUT/authoring" \
            > "$SMOKE_OUT/author.stdout.json"
          author_status=$?
          set -e
          python3 - "$SMOKE_OUT" "$author_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          author_status = int(sys.argv[2])
          workdir = out / "authoring"
          report_path = workdir / "circuit-reports" / "design-report.json"
          if report_path.is_file():
              raw_report = report_path.read_text(encoding="utf-8")
              try:
                  report = json.loads(raw_report)
              except json.JSONDecodeError:
                  print(raw_report)
                  report = {}
              if isinstance(report, dict):
                  for name in ("connectivity", "erc", "drc"):
                      gate = report.get(name)
                      verdict = gate.get("verdict") if isinstance(gate, dict) else "missing"
                      print(f"{name}: {verdict}")
              else:
                  print(raw_report)
          else:
              print((out / "author.stdout.json").read_text(encoding="utf-8"))
              report = {}
          result_path = workdir / "e2e-authoring.json"
          result = (
              json.loads(result_path.read_text(encoding="utf-8"))
              if result_path.is_file()
              else {}
          )
          gates_pass = all(
              isinstance(report.get(name), dict)
              and report[name].get("verdict") == "pass"
              for name in ("connectivity", "erc", "drc")
          )
          if (
              author_status != 0
              or report.get("verdict") != "pass"
              or not gates_pass
              or result.get("verdict") != "pass"
          ):
              raise SystemExit("circuit launcher authoring smoke did not pass")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: locked-circuit-launcher-smoke
          path: ${{ github.workspace }}/circuit-smoke-out/
          if-no-files-found: ignore
          retention-days: 14
      - run: uv run python scripts/verify_all.py --stage standard
        env:
          CIRCUIT_TOOLS_IMAGE: ${{ steps.image.outputs.ref }}
