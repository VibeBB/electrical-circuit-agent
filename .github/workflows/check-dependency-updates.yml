name: Check dependency updates

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-dependency-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Create report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_MARKDOWN: ${{ runner.temp }}/report.md
          REPORT_JSON: ${{ runner.temp }}/report.json
        run: |
          uv run python scripts/check_dependency_updates.py --markdown "$REPORT_MARKDOWN" --json "$REPORT_JSON"
          printf '\nworkflow: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$REPORT_MARKDOWN"
          cat "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          echo "outdated=$(python3 -c 'import json; print(json.load(open("'"$REPORT_JSON"'", encoding="utf-8"))["outdated_count"])')" >> "$GITHUB_OUTPUT"
      - name: Update report issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_MARKDOWN: ${{ runner.temp }}/report.md
          OUTDATED: ${{ steps.report.outputs.outdated }}
        run: |
          set -euo pipefail
          gh label create dependencies --repo "$GITHUB_REPOSITORY" --color 0366d6 \
            --description "Dependency update report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label dependencies \
            --search "in:title 依存アップデート確認レポート" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_MARKDOWN"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "依存アップデート確認レポート" \
              --label dependencies --body-file "$REPORT_MARKDOWN" | sed 's#.*/##')
          fi
          if [ "$OUTDATED" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "更新候補が無くなりました。"
          fi
