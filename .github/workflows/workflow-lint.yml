name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    # Digest-lock bot PRs only touch docker/image-digests.json. Filter at
    # trigger level so no run is created: a queued (action_required) run
    # gets killed by the branch-deleting merge with a spurious
    # "workflow file issue" failure.
    paths-ignore: ["docker/image-digests.json"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    # branches/branches-ignore filter the PR's base branch (always main),
    # not its head, so bot-branch lock PRs are skipped at the job level too.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'bot/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Zizmor
        env:
          # GH_TOKEN enables zizmor's online audits (advisory DB lookups,
          # ref/tag resolution); without it zizmor runs in offline mode.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format sarif .github/workflows > results.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: results.sarif
      - name: Fail on zizmor findings
        # The SARIF run always exits 0 so findings can be uploaded; the
        # plain-format run exits non-zero when findings exist, which makes
        # them gate this check.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format plain .github/workflows
