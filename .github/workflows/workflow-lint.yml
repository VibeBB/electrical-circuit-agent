name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Zizmor
        env:
          # GH_TOKEN enables zizmor's online audits (advisory DB lookups,
          # ref/tag resolution); without it zizmor runs in offline mode.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format sarif .github/workflows > results.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        with:
          sarif_file: results.sarif
