name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  # Dispatched by the publish workflow on digest-lock branches so the
  # lint verdict also reports on the head SHA. Only the pull_request run
  # satisfies the required zizmor check: GitHub ignores workflow_dispatch
  # check runs for required status checks, so the PR trigger must stay
  # unfiltered on digest-lock PRs (they only touch docker/image-digests.json
  # and the plugin's tools-image.json).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Uploads the zizmor SARIF report to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          # The sha256 is the published value from
          # actionlint_1.7.12_checksums.txt on the v1.7.12 release.
          tarball="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 10 \
            --output "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$tarball" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -oneline
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: workflow-lint
      - name: Zizmor
        env:
          # GH_TOKEN enables zizmor's online audits (advisory DB lookups,
          # ref/tag resolution); without it zizmor runs in offline mode.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format sarif .github/workflows > results.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Bot digest-lock branches are deleted on auto-merge, so their SARIF
        # cannot be uploaded; the plain zizmor run below still gates them.
        if: always() && !startsWith(github.head_ref || github.ref_name, 'bot/update-image-digests-')
        with:
          sarif_file: results.sarif
      - name: Fail on zizmor findings
        # The SARIF run always exits 0 so findings can be uploaded; the
        # plain-format run exits non-zero when findings exist, which makes
        # them gate this check.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format plain .github/workflows
