name: Workflow lint

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Uploads the zizmor SARIF report to code scanning.
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          # The sha256 is the published value from
          # actionlint_1.7.12_checksums.txt on the v1.7.12 release.
          tarball="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 10 \
            --output "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$tarball" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -oneline
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: workflow-lint
      - name: Fetch pinned zizmor wheel
        run: |
          set -euo pipefail
          # The sha256 is the published value for
          # zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl on PyPI.
          wheel="zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 10 \
            --output "$RUNNER_TEMP/$wheel" \
            "https://files.pythonhosted.org/packages/63/55/1900b53d34dcebc207cf3ceb7957b3748e8bb40958f062e3853ab72f2395/$wheel"
          echo "eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e  $RUNNER_TEMP/$wheel" \
            | sha256sum -c -
      - name: Zizmor
        env:
          # GH_TOKEN enables zizmor's online audits (advisory DB lookups,
          # ref/tag resolution). Bot digest-lock branches can be deleted
          # mid-run, so resolve nothing online there.
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          flags=""
          case "$HEAD_REF" in bot/update-image-digests-*) flags="--offline";; esac
          uvx --from "$RUNNER_TEMP/zizmor-1.30.1-py3-none-manylinux_2_28_x86_64.whl" \
            zizmor $flags --format sarif .github/workflows > results.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Bot digest-lock branches are deleted on auto-merge, so their SARIF
        # cannot be uploaded; the plain zizmor run below still gates them.
        if: always() && hashFiles('results.sarif') != '' && !startsWith(github.head_ref || github.ref_name, 'bot/update-image-digests-')
        with:
          sarif_file: results.sarif
      - name: Fail on zizmor findings
        # The SARIF run always exits 0 so findings can be uploaded; gate on
        # the results it recorded instead of scanning a second time.
        run: |
          python3 - <<'PY'
          import json, sys
          results = json.load(open("results.sarif", encoding="utf-8"))["runs"][0]["results"]
          for r in results:
              try:
                  loc = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
              except (KeyError, IndexError):
                  loc = "?"
              print(f"- {r['ruleId']} {loc}: {r['message']['text'][:200]}")
          print(f"{len(results)} zizmor finding(s)")
          sys.exit(1 if results else 0)
          PY
