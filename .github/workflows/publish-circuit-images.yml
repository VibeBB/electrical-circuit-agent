name: Publish circuit images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/circuit/**"
      - "scripts/e2e_authoring.py"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - "scripts/smoke_*"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish-circuit-images.yml"
      - "scripts/publish_image_pin_pr.sh"
      - "scripts/package_level_sbom.py"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/circuit/skills/circuit-workflow/tools-image.json"
      - "!docker/README.md"
  workflow_dispatch:
    inputs:
      skip_tools:
        description: "Reuse the locked tools image instead of rebuilding it"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Rehearse the pipeline: build locally and run the scan/SBOM gates without pushing tags, promoting :latest, attesting, uploading SARIF, or opening the digest-lock PR"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-circuit-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write # approve gated runs and dispatch ci/lock checks on branches and main
      contents: write # push the digest-lock branch
      packages: write # push images to GHCR
      pull-requests: write # open, close, and merge digest-lock PRs
      id-token: write # OIDC for build-provenance attestation
      attestations: write # stores the attestation
      artifact-metadata: write # creates the attestation storage record
      security-events: write # uploads the Trivy SARIF scans to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: |
          # The Trivy cache dir is shared by every scan in the job and
          # restored/saved weekly via actions/cache so the vulnerability
          # DB is not refetched per run.
          {
            echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}"
            echo "TRIVY_DB_WEEK=$(date -u +%G-W%V)"
            echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache"
          } >> "$GITHUB_ENV"
      - name: Restore Trivy vulnerability DB cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          # A dispatched run on a branch can read the cache but must not
          # write it; the save step below only runs on main.
          key: trivy-db-${{ env.TRIVY_DB_WEEK }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ env.TRIVY_DB_WEEK }}-
            trivy-db-
          fail-on-cache-miss: false
      - name: Save Trivy vulnerability DB cache
        if: github.ref_name == 'main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          # Unique save key keeps the refreshed DB warm for later runs;
          # the weekly restore-keys rotate the baseline once per ISO week.
          key: trivy-db-${{ env.TRIVY_DB_WEEK }}-${{ github.run_id }}
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          # The SDK clone tag and the lock provenance follow the project pin,
          # not a hardcoded version that can drift from pyproject.toml/uv.lock.
          sdk_version=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openhands-sdk'))")
          if [[ ! "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid SDK version: $sdk_version" >&2
            exit 1
          fi
          {
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "CERN_COMMIT=$cern_commit"
            echo "SDK_VERSION=$sdk_version"
          } >> "$GITHUB_ENV"
          echo "cern_commit=$cern_commit" >> "$GITHUB_OUTPUT"
      - name: Build and publish tools
        id: tools
        if: inputs.skip_tools != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/circuit-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            CERN_COMMIT=${{ steps.source.outputs.cern_commit }}
          # Push only the immutable sha tag: :latest is promoted after the
          # Trivy gate passes so a failing image never serves it. Dry runs
          # load the image into the local daemon for the scans instead of
          # pushing.
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/circuit-tools:${{ github.sha }}-tools
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Scan tools image (Trivy SARIF)
        id: trivy-scan-tools
        if: inputs.skip_tools != true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the sha tag the build pushed — it resolves to the pushed
          # digest remotely on real runs and to the daemon-loaded image in
          # dry runs; either way it is the content the SBOM and provenance
          # attestations bind to.
          scan-ref: ghcr.io/${{ env.IMAGE_OWNER }}/circuit-tools:${{ github.sha }}-tools
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-circuit-tools.sarif
          limit-severities-for-sarif: true
      - name: Promote tools :latest
        if: inputs.skip_tools != true && inputs.dry_run != true
        env:
          TOOLS_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          # imagetools copies the pushed manifest server-side — no re-push,
          # so attestations and the SBOM keep referencing the same digest.
          docker buildx imagetools create \
            --tag "ghcr.io/${IMAGE_OWNER}/circuit-tools:latest" \
            "ghcr.io/${IMAGE_OWNER}/circuit-tools@${TOOLS_DIGEST}"
      - name: Scan tools image (Trivy JSON)
        # Runs even when the SARIF gate failed so the diagnostic report and
        # the blocking-CVE summary still have data; guarded on the build
        # digest so a failed build produces no malformed scan ref.
        if: ${{ always() && inputs.skip_tools != true && steps.tools.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ env.IMAGE_OWNER }}/circuit-tools:${{ github.sha }}-tools
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          ignore-unfixed: false
          list-all-pkgs: 'true'
          exit-code: '0'
          format: json
          output: trivy-circuit-tools.json
          skip-setup-trivy: true
      - name: Report blocking tools CVEs
        # The SARIF gate prints only "exit code 1"; list the fixable
        # HIGH/CRITICAL findings that actually blocked the publish.
        if: ${{ failure() && inputs.skip_tools != true && hashFiles('trivy-circuit-tools.json') != '' }}
        run: |
          python3 scripts/trivy_report_utils.py blocking-cves \
            trivy-circuit-tools.json circuit-tools >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tools Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: ${{ always() && inputs.skip_tools != true && inputs.dry_run != true && hashFiles('trivy-circuit-tools.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-circuit-tools.sarif
          category: trivy-circuit-tools
      - name: Upload tools Trivy JSON report
        if: ${{ always() && inputs.skip_tools != true && hashFiles('trivy-circuit-tools.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-tools-trivy
          path: trivy-circuit-tools.json
          retention-days: 90
      - name: Attest tools image provenance
        id: attest
        if: inputs.skip_tools != true && inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/circuit-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$SKIP_TOOLS" = true ]; then
            TOOLS_REF=$(uv run python scripts/print_locked_image.py --entry circuit_tools)
            uv run python scripts/pull_locked_image.py --entry circuit_tools --record "$RUNNER_TEMP/pull-tools.json"
            TOOLS_TAG=$(python3 -c 'import json; print(json.load(open("docker/image-digests.json", encoding="utf-8"))["circuit_tools"]["tag"])')
            TOOLS_DIGEST="${TOOLS_REF##*@}"
          else
            case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
            if [ "$DRY_RUN" = true ]; then
              # The build is loaded into the local daemon only, so local
              # consumers resolve the sha tag, not a pushed digest.
              TOOLS_REF="ghcr.io/${IMAGE_OWNER}/circuit-tools:${SOURCE_SHA}-tools"
            else
              TOOLS_REF="ghcr.io/${IMAGE_OWNER}/circuit-tools@${BUILT_DIGEST}"
            fi
            TOOLS_TAG="${SOURCE_SHA}-tools"
            TOOLS_DIGEST="${BUILT_DIGEST}"
          fi
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$TOOLS_REF" "$TOOLS_DIGEST" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Generate tools SPDX SBOM
        if: inputs.skip_tools != true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # Dry runs read the daemon-loaded image; real runs pull the
          # pushed digest from the registry.
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.TOOLS_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/circuit-tools.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package tools SPDX SBOM
        if: inputs.skip_tools != true
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/circuit-tools.full.spdx.json" \
            "$RUNNER_TEMP/circuit-tools.spdx.json"
      - name: Guard tools SPDX SBOM size
        if: inputs.skip_tools != true
        env:
          SBOM_PATH: ${{ runner.temp }}/circuit-tools.spdx.json
        run: |
          set -euo pipefail
          df -h /tmp "$RUNNER_TEMP"
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi

      - name: Validate tools SPDX SBOM
        if: inputs.skip_tools != true
        run: |
          python3 - "${{ runner.temp }}/circuit-tools.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("tools SBOM must use SPDX-2.3")
          PY
      - name: Attest tools SBOM
        if: inputs.skip_tools != true && inputs.dry_run != true
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/circuit-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          sbom-path: ${{ runner.temp }}/circuit-tools.spdx.json
          push-to-registry: true
      - name: Upload full tools SPDX SBOM
        if: inputs.skip_tools != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-tools-spdx-sbom
          path: ${{ runner.temp }}/circuit-tools.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published tools
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/circuit-tools.json"
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Dry-run images are already in the local daemon (built with
          # --load, or pulled by pull_locked_image.py when tools are
          # skipped); the sha tag does not exist in the registry.
          if [ "$DRY_RUN" != true ]; then
            docker pull "$TOOLS_REF"
          fi
          docker run --rm --user circuit -v "$PWD/fixtures/smoke-board:/work:ro" "$TOOLS_REF" python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - name: Clone OpenHands SDK
        run: git clone --depth 1 --branch "v${SDK_VERSION}" https://github.com/OpenHands/software-agent-sdk "$RUNNER_TEMP/sdk"
      - name: Stabilize server build cache tag
        # Upstream keys the registry cache tag on the base-image digest, so
        # every new tools digest opens a fresh (empty) cache namespace and
        # the importer logs "not found" on every publish. The
        # base-image-independent builder/binary-builder/acp-providers stages
        # are the bulk of the server build, so point the cache at a stable
        # per-target tag. Fail-open: if upstream renames the property, build
        # unpatched rather than break.
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/sdk/openhands-agent-server/openhands/agent_server/docker/build.py"
          needle='buildcache-{self.target}-{self.base_image_slug}{self.flavor_suffix}'
          replacement='buildcache-{self.target}{self.flavor_suffix}'
          if grep -qF "$needle" "$f"; then
            sed -i "s/$needle/$replacement/" "$f"
            grep -qF "$replacement" "$f"
            echo "patched: registry cache tag is now buildcache-<target>-main"
          else
            echo "::warning::upstream build.py cache_tags layout changed; building without stable cache tag"
            {
              echo "## Server build cache tag patch skipped"
              echo
              echo "Upstream build.py no longer contains the pinned"
              echo "\`cache_tags\` expression; this server build runs WITHOUT the"
              echo "stable registry cache tag (a full cold build). The weekly"
              echo "dependency check flags the drift as an update candidate —"
              echo "fix the patch before it silently doubles server build time."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and publish server
        env:
          SDK_SHA: ${{ github.sha }}
          CUSTOM_TAGS: latest
          # Arm the upstream registry cache export: without it the
          # cache-from buildcache-*-main ref 404s on every publish and each
          # server build runs cold.
          OPENHANDS_BUILDKIT_CACHE_MODE: max
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish_flag="--push"
          if [ "$DRY_RUN" = true ]; then
            # Rehearsal: load the server image into the local daemon
            # instead of pushing.
            publish_flag="--load"
          fi
          uv run --project "$RUNNER_TEMP/sdk" python \
            "$RUNNER_TEMP/sdk/openhands-agent-server/openhands/agent_server/docker/build.py" \
            --base-image "$TOOLS_REF" --image "ghcr.io/${IMAGE_OWNER}/circuit-server" \
            --target source --platforms linux/amd64 "$publish_flag" --sdk-project-root "$RUNNER_TEMP/sdk"
      - name: Strip pip payload from server image
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Repackage the just-pushed tag: drop the unused pip payload (module,
          # dist-info, console scripts, ensurepip bundle) and the dead uv
          # cache, then resolve the digest below against the stripped image.
          publish_flag="--push"
          if [ "$DRY_RUN" = true ]; then
            publish_flag="--load"
          fi
          docker buildx build \
            --build-arg "BASE_IMAGE=ghcr.io/${IMAGE_OWNER}/circuit-server:${SOURCE_SHA}-latest-source" \
            --tag "ghcr.io/${IMAGE_OWNER}/circuit-server:${SOURCE_SHA}-latest-source" \
            --platform linux/amd64 "$publish_flag" --provenance=false \
            -f docker/circuit-server-strip.Dockerfile .
      - name: Resolve server digest
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SERVER_TAG="${SOURCE_SHA}-latest-source"
          if [ "$DRY_RUN" = true ]; then
            # The image exists only in the local daemon: the image ID stands
            # in for the manifest digest — the digest-bound steps
            # (promote/attest/digest lock) are skipped in a dry run.
            SERVER_DIGEST=$(docker image inspect --format '{{.Id}}' \
              "ghcr.io/${IMAGE_OWNER}/circuit-server:${SERVER_TAG}")
            SERVER_REF="ghcr.io/${IMAGE_OWNER}/circuit-server:${SERVER_TAG}"
          else
            SERVER_DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
              "ghcr.io/${IMAGE_OWNER}/circuit-server:${SERVER_TAG}" | tr -d '"')
            SERVER_REF="ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}"
          fi
          case "$SERVER_DIGEST" in sha256:*) ;; *) echo "invalid server digest: $SERVER_DIGEST" >&2; exit 1 ;; esac
          printf 'SERVER_TAG=%s\nSERVER_DIGEST=%s\nSERVER_REF=%s\n' "$SERVER_TAG" "$SERVER_DIGEST" "$SERVER_REF" >> "$GITHUB_ENV"
      - name: Scan server image (Trivy SARIF)
        id: trivy-scan-server
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # Scan the pushed digest on real runs; SERVER_REF carries the
          # daemon-local tag under dry runs.
          scan-ref: ${{ env.SERVER_REF }}
          version: v0.75.0
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-circuit-server.sarif
          limit-severities-for-sarif: true
      - name: Promote server :latest
        if: inputs.dry_run != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${IMAGE_OWNER}/circuit-server:latest" \
            "ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}"
      - name: Scan server image (Trivy JSON)
        # Runs even when the SARIF gate failed so the diagnostic report and
        # the blocking-CVE summary still have data; guarded on the resolved
        # digest so a failed build produces no malformed scan ref.
        if: ${{ always() && env.SERVER_DIGEST != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.SERVER_REF }}
          version: v0.75.0
          scanners: vuln,secret,misconfig,license
          ignore-unfixed: false
          list-all-pkgs: 'true'
          exit-code: '0'
          format: json
          output: trivy-circuit-server.json
          skip-setup-trivy: true
      - name: Report blocking server CVEs
        if: ${{ failure() && hashFiles('trivy-circuit-server.json') != '' }}
        run: |
          python3 scripts/trivy_report_utils.py blocking-cves \
            trivy-circuit-server.json circuit-server >> "$GITHUB_STEP_SUMMARY"
      - name: Upload server Trivy SARIF
        # A rehearsal must not file code-scanning alerts.
        if: ${{ always() && inputs.dry_run != true && hashFiles('trivy-circuit-server.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-circuit-server.sarif
          category: trivy-circuit-server
      - name: Upload server Trivy JSON report
        if: ${{ always() && hashFiles('trivy-circuit-server.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-server-trivy
          path: trivy-circuit-server.json
          retention-days: 90
      - name: Attest server image provenance
        id: attest_server
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/circuit-server
          subject-digest: ${{ env.SERVER_DIGEST }}
          push-to-registry: true
      - name: Generate server SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # Dry runs read the daemon-loaded image; real runs pull the
          # pushed digest from the registry.
          SYFT_SOURCE_IMAGE_DEFAULT_PULL_SOURCE: ${{ inputs.dry_run == true && 'docker' || 'registry' }}
          TMPDIR: ${{ runner.temp }}
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.SERVER_REF }}
          format: spdx-json
          output-file: ${{ runner.temp }}/circuit-server.full.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Package server SPDX SBOM
        run: |
          python3 scripts/package_level_sbom.py \
            "$RUNNER_TEMP/circuit-server.full.spdx.json" \
            "$RUNNER_TEMP/circuit-server.spdx.json"
      - name: Guard server SPDX SBOM size
        env:
          SBOM_PATH: ${{ runner.temp }}/circuit-server.spdx.json
        run: |
          set -euo pipefail
          size=$(stat -c%s "$SBOM_PATH")
          echo "SBOM size: ${size} bytes"
          if [ "$size" -gt 16777216 ]; then
            echo "::error::SBOM exceeds 16777216 bytes: ${size} bytes"
            exit 1
          fi
      - name: Validate server SPDX SBOM
        run: |
          python3 - "${{ runner.temp }}/circuit-server.spdx.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          sbom = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("server SBOM must use SPDX-2.3")
          PY
      - name: Attest server SBOM
        id: attest_server_sbom
        if: inputs.dry_run != true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/vibebb/circuit-server
          subject-digest: ${{ env.SERVER_DIGEST }}
          sbom-path: ${{ runner.temp }}/circuit-server.spdx.json
          push-to-registry: true
      - name: Upload full server SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-server-spdx-sbom
          path: ${{ runner.temp }}/circuit-server.full.spdx.json
          retention-days: 90
          if-no-files-found: error
      - name: Measure published server
        run: |
          set -euo pipefail
          uv run python scripts/measure_image_tools.py \
            --image-ref "$SERVER_REF" \
            --out "$RUNNER_TEMP/circuit-server.json"
      - name: Record published image summary
        env:
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          {
            echo "## Circuit images"
            echo
            if [ "${SKIP_TOOLS:-false}" = true ]; then
              echo "- **tools**: existing locked image (not rebuilt)"
            else
              echo "- **tools**: \`$TOOLS_REF\`"
            fi
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **server**: \`ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}\`"
            echo "- **server tag**: \`$SERVER_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SBOM_ATTESTATION_URL: ${{ steps.attest_sbom.outputs.attestation-url }}
          SERVER_ATTESTATION_URL: ${{ steps.attest_server.outputs.attestation-url }}
          SERVER_SBOM_ATTESTATION_URL: ${{ steps.attest_server_sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${SERVER_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          git submodule update -q --init --recursive
          if [ "${SKIP_TOOLS:-false}" != true ]; then
            uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
              --entry circuit_tools --image "ghcr.io/${IMAGE_OWNER}/circuit-tools" \
              --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
              --attestation "$ATTESTATION_URL" \
              --sbom-attestation "$SBOM_ATTESTATION_URL" \
              --workflow-run "$workflow_run" --dockerfile docker/circuit-tools.Dockerfile \
              --tools-json "$RUNNER_TEMP/circuit-tools.json"
          fi
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry circuit_server --image "ghcr.io/${IMAGE_OWNER}/circuit-server" \
            --tag "$SERVER_TAG" --digest "$SERVER_DIGEST" --published-at "$published_at" \
            --attestation "$SERVER_ATTESTATION_URL" \
            --sbom-attestation "$SERVER_SBOM_ATTESTATION_URL" \
            --workflow-run "$workflow_run" --dockerfile "sdk:openhands-agent-server/v${SDK_VERSION}" \
            --tools-json "$RUNNER_TEMP/circuit-server.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/skills/*/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["circuit_tools"]
          pin = "plugins/circuit/skills/circuit-workflow/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) also catches an untracked
          # lock file, matching the other agent publish workflows.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/circuit/skills/circuit-workflow/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/circuit/skills/circuit-workflow/tools-image.json
          git commit -m "Update circuit image digest lock"
          retry git push --set-upstream origin "$branch"
          if [ "${SKIP_TOOLS:-false}" = true ]; then
            tools_line="tools: locked image (not rebuilt)"
          else
            tools_line="tools: ${TOOLS_REF}"
          fi
          body=$(printf '%s\n' \
            "The publish workflow updated the circuit image digest lock." \
            "" \
            "$tools_line" \
            "server: ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update circuit image digest lock" --body "$body")
          echo "pin PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/publish_image_pin_pr.sh "$pr_url" "$branch" "${base_sha:-}" "ci.yml locked-image-check.yml workflow-lint.yml"
      - name: Report dry run
        if: inputs.dry_run == true
        run: |
          {
            echo "## Publish dry run"
            echo
            echo "Rehearsal for ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Ran end-to-end: tools/server builds (loaded into the local daemon),"
            echo "the Trivy SARIF/JSON gates, the SPDX SBOM chain, measurements, and the"
            echo "tools smoke test."
            echo
            echo "Skipped (irreversible):"
            echo "- pushing the immutable \`<sha>-tools\` and \`<sha>-latest-source\` tags"
            echo "- promoting \`:latest\` on circuit-tools and circuit-server"
            echo "- build-provenance and SBOM attestations"
            echo "- Trivy SARIF uploads to code scanning"
            echo "- the digest-lock PR and its post-merge dispatches"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render publish phase timings
        # Runs on failure too — the step list up to the failing step is
        # exactly where a duration regression would hide.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import subprocess
          from datetime import datetime

          out = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100",
                  "--jq",
                  ".jobs[0].steps",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          fmt = "%Y-%m-%dT%H:%M:%SZ"
          print("## Publish phase timings")
          print()
          print("| step | elapsed |")
          print("|---|---|")
          for step in json.loads(out):
              if not step.get("completed_at"):
                  continue
              started = datetime.strptime(step["started_at"], fmt)
              completed = datetime.strptime(step["completed_at"], fmt)
              print(f"| {step['name']} | {int((completed - started).total_seconds())}s |")
          PY
