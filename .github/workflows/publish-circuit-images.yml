name: Publish circuit images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "plugins/circuit/**"
      - "scripts/e2e_authoring.py"
      - "scripts/measure_image_tools.py"
      - "scripts/print_locked_image.py"
      - "scripts/pull_locked_image.py"
      - "scripts/update_image_digest_lock.py"
      - "scripts/smoke_*"
      - "pyproject.toml"
      - "uv.lock"
      - "!docker/image-digests.json"
      # The plugin pin is written by this workflow itself; exclude it so a
      # merged pin PR does not trigger another publish.
      - "!plugins/circuit/skills/circuit-workflow/tools-image.json"
      - "!docker/README.md"
  workflow_dispatch:
    inputs:
      skip_tools:
        description: "Reuse the locked tools image instead of rebuilding it"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-circuit-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write # approve gated runs and dispatch ci/lock checks on branches and main
      contents: write # push the digest-lock branch
      packages: write # push images to GHCR
      pull-requests: write # open, close, and merge digest-lock PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Resolve source revision
        id: source
        run: |
          set -euo pipefail
          cern_commit=$(git -C libraries/cern-kicad-libs rev-parse HEAD)
          if [[ ! "$cern_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid CERN commit: $cern_commit" >&2
            exit 1
          fi
          # The SDK clone tag and the lock provenance follow the project pin,
          # not a hardcoded version that can drift from pyproject.toml/uv.lock.
          sdk_version=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('openhands-sdk'))")
          if [[ ! "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid SDK version: $sdk_version" >&2
            exit 1
          fi
          {
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "CERN_COMMIT=$cern_commit"
            echo "SDK_VERSION=$sdk_version"
          } >> "$GITHUB_ENV"
          echo "cern_commit=$cern_commit" >> "$GITHUB_OUTPUT"
      - name: Build and publish tools
        id: tools
        if: inputs.skip_tools != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/circuit-tools.Dockerfile
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            CERN_COMMIT=${{ steps.source.outputs.cern_commit }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/circuit-tools:${{ github.sha }}-tools
            ghcr.io/${{ env.IMAGE_OWNER }}/circuit-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Resolve tools digest
        env:
          BUILT_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_tools }}" = true ]; then
            TOOLS_REF=$(uv run python scripts/print_locked_image.py --entry circuit_tools)
            uv run python scripts/pull_locked_image.py --entry circuit_tools --record "$RUNNER_TEMP/pull-tools.json"
            TOOLS_TAG=$(python3 -c 'import json; print(json.load(open("docker/image-digests.json", encoding="utf-8"))["circuit_tools"]["tag"])')
          else
            case "$BUILT_DIGEST" in sha256:*) ;; *) echo "invalid tools digest: $BUILT_DIGEST" >&2; exit 1 ;; esac
            TOOLS_REF="ghcr.io/${IMAGE_OWNER}/circuit-tools@${BUILT_DIGEST}"
            TOOLS_TAG="${SOURCE_SHA}-tools"
          fi
          printf 'TOOLS_REF=%s\nTOOLS_DIGEST=%s\nTOOLS_TAG=%s\n' "$TOOLS_REF" "${TOOLS_REF##*@}" "$TOOLS_TAG" >> "$GITHUB_ENV"
      - name: Measure published tools
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: uv run python scripts/measure_image_tools.py --image-ref "$TOOLS_REF" --out "$RUNNER_TEMP/circuit-tools.json"
      - name: Verify published tools smoke
        env:
          TOOLS_REF: ${{ env.TOOLS_REF }}
        run: |
          set -euo pipefail
          docker pull "$TOOLS_REF"
          docker run --rm --user circuit -v "$PWD/fixtures/smoke-board:/work:ro" "$TOOLS_REF" python3 /opt/circuit/bin/smoke_kicad11_konnect.py
      - name: Clone OpenHands SDK
        run: git clone --depth 1 --branch "v${SDK_VERSION}" https://github.com/OpenHands/software-agent-sdk "$RUNNER_TEMP/sdk"
      - name: Build and publish server
        env:
          SDK_SHA: ${{ github.sha }}
          CUSTOM_TAGS: latest
          # Arm the upstream registry cache export: without it the
          # cache-from buildcache-*-main ref 404s on every publish and each
          # server build runs cold.
          OPENHANDS_BUILDKIT_CACHE_MODE: max
        run: |
          set -euo pipefail
          uv run --project "$RUNNER_TEMP/sdk" python \
            "$RUNNER_TEMP/sdk/openhands-agent-server/openhands/agent_server/docker/build.py" \
            --base-image "$TOOLS_REF" --image "ghcr.io/${IMAGE_OWNER}/circuit-server" \
            --target source --platforms linux/amd64 --push --sdk-project-root "$RUNNER_TEMP/sdk"
      - name: Resolve server digest
        run: |
          set -euo pipefail
          SERVER_TAG="${SOURCE_SHA}-latest-source"
          SERVER_DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "ghcr.io/${IMAGE_OWNER}/circuit-server:${SERVER_TAG}" | tr -d '"')
          case "$SERVER_DIGEST" in sha256:*) ;; *) echo "invalid server digest: $SERVER_DIGEST" >&2; exit 1 ;; esac
          printf 'SERVER_TAG=%s\nSERVER_DIGEST=%s\n' "$SERVER_TAG" "$SERVER_DIGEST" >> "$GITHUB_ENV"
          docker buildx imagetools create --tag "ghcr.io/${IMAGE_OWNER}/circuit-server:latest" \
            "ghcr.io/${IMAGE_OWNER}/circuit-server:${SERVER_TAG}"
      - name: Measure published server
        run: |
          set -euo pipefail
          uv run python scripts/measure_image_tools.py \
            --image-ref "ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}" \
            --out "$RUNNER_TEMP/circuit-server.json"
      - name: Record published image summary
        env:
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          {
            echo "## Circuit images"
            echo
            if [ "${SKIP_TOOLS:-false}" = true ]; then
              echo "- **tools**: existing locked image (not rebuilt)"
            else
              echo "- **tools**: \`$TOOLS_REF\`"
            fi
            echo "- **tools digest**: \`$TOOLS_DIGEST\`"
            echo "- **tools tag**: \`$TOOLS_TAG\`"
            echo "- **server**: \`ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}\`"
            echo "- **server tag**: \`$SERVER_TAG\`"
            echo "- **workflow run**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update digest lock and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_TOOLS: ${{ inputs.skip_tools }}
        run: |
          set -euo pipefail
          retry() {
            # Transient GitHub API/server errors (HTTP 5xx, TLS resets,
            # truncated responses) should not hard-fail a multi-minute
            # publish: retry gh/git calls with backoff before giving up.
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          dispatch_workflow() {
            # GITHUB_TOKEN-driven push/pull_request events never produce a real gate:
            # at most a stillborn pull_request run is recorded (cancelled before merge
            # below), so CI for the lock branch and the checks after the merge is
            # started explicitly.
            local workflow="$1" ref="$2" started run_id=""
            shift 2
            # Reset per-call so a previous dispatch's conclusion cannot leak
            # into the summary when this run is not observed.
            DISPATCH_RUN_URL=""
            DISPATCH_CONCLUSION=""
            started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            retry gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$ref" "$@"
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$ref" \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty' || true)
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "workflow_dispatch of $workflow for $ref was not observed" >&2
              return 1
            fi
            DISPATCH_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "$workflow run for $ref: ${DISPATCH_RUN_URL}"
            gh run watch --repo "$GITHUB_REPOSITORY" "$run_id" --interval 30 || true
            # An empty conclusion is a transient API failure, not a run
            # verdict: re-query until the API reports the conclusion.
            DISPATCH_CONCLUSION=""
            for _ in $(seq 1 6); do
              DISPATCH_CONCLUSION=$(retry gh run view --repo "$GITHUB_REPOSITORY" "$run_id" \
                --json conclusion --jq '.conclusion // empty' || true)
              [ -n "$DISPATCH_CONCLUSION" ] && break
              sleep 10
            done
            DISPATCH_CONCLUSION="${DISPATCH_CONCLUSION:-unknown}"
            echo "$workflow conclusion for $ref: ${DISPATCH_CONCLUSION}"
            [ "$DISPATCH_CONCLUSION" = "success" ]
          }
          dispatch_and_forget() {
            # Post-merge checks are fire-and-forget: main-ci-failure-issue
            # watches every completed main run and files the tracking
            # issue, so this job only records the dispatched run URL and
            # returns without waiting for the conclusion.
            local workflow="$1" ref="$2" started run_id=""
            shift 2
            DISPATCH_RUN_URL=""
            started=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            retry gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$ref" "$@"
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(retry gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$ref" \
                --event workflow_dispatch --created ">=$started" --json databaseId --jq '.[0].databaseId // empty' || true)
              [ -n "$run_id" ] && break
            done
            if [ -z "$run_id" ]; then
              echo "workflow_dispatch of $workflow for $ref was not observed" >&2
              return 1
            fi
            DISPATCH_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "$workflow run for $ref: ${DISPATCH_RUN_URL}"
          }
          published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          workflow_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The lock branch starts from the current main tip, not from the published
          # source commit, so the PR stays mergeable when main moved during the build.
          git fetch -q origin main
          base_sha=$(git rev-parse origin/main)
          branch="bot/update-image-digests-${SERVER_DIGEST#sha256:}"
          branch="${branch:0:70}"
          git switch -q -c "$branch" "$base_sha"
          git submodule update -q --init --recursive
          if [ "${SKIP_TOOLS:-false}" != true ]; then
            uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
              --entry circuit_tools --image "ghcr.io/${IMAGE_OWNER}/circuit-tools" \
              --tag "$TOOLS_TAG" --digest "$TOOLS_DIGEST" --published-at "$published_at" \
              --workflow-run "$workflow_run" --dockerfile docker/circuit-tools.Dockerfile \
              --tools-json "$RUNNER_TEMP/circuit-tools.json"
          fi
          uv run python scripts/update_image_digest_lock.py --lock docker/image-digests.json \
            --entry circuit_server --image "ghcr.io/${IMAGE_OWNER}/circuit-server" \
            --tag "$SERVER_TAG" --digest "$SERVER_DIGEST" --published-at "$published_at" \
            --workflow-run "$workflow_run" --dockerfile "sdk:openhands-agent-server/v${SDK_VERSION}" \
            --tools-json "$RUNNER_TEMP/circuit-server.json"
          # Ship the same pin inside the plugin so an installed plugin can
          # resolve the tools image without the extension cache (the
          # launcher reads <plugin>/skills/*/tools-image.json first).
          python3 - <<'PY'
          import json

          entry = json.load(open("docker/image-digests.json"))["circuit_tools"]
          pin = "plugins/circuit/skills/circuit-workflow/tools-image.json"
          with open(pin, "w", encoding="utf-8") as out:
              json.dump(entry, out, indent=2)
              out.write("\n")
          PY
          # status --porcelain (not diff --quiet) also catches an untracked
          # lock file, matching the other agent publish workflows.
          if [ -z "$(git status --porcelain -- docker/image-digests.json plugins/circuit/skills/circuit-workflow/tools-image.json)" ]; then
            echo "Image digest lock is unchanged; no pull request is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker/image-digests.json plugins/circuit/skills/circuit-workflow/tools-image.json
          git commit -m "Update circuit image digest lock"
          retry git push --set-upstream origin "$branch"
          if [ "${SKIP_TOOLS:-false}" = true ]; then
            tools_line="tools: locked image (not rebuilt)"
          else
            tools_line="tools: ${TOOLS_REF}"
          fi
          body=$(printf '%s\n' \
            "The publish workflow updated the circuit image digest lock." \
            "" \
            "$tools_line" \
            "server: ghcr.io/${IMAGE_OWNER}/circuit-server@${SERVER_DIGEST}" \
            "workflow run: ${workflow_run}")
          # A stale bot PR from an earlier publish is superseded by this
          # run's digest: close it and delete its branch so it cannot
          # linger for manual review.
          for old_pr in $(retry gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName --jq '.[] | select(.headRefName | startswith("bot/update")) | .number' || true); do
            retry gh pr close "$old_pr" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --delete-branch || true
          done
          pr_url=$(retry gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Update circuit image digest lock" --body "$body")
          # A pull_request-triggered ci.yml run is also recorded for the bot
          # PR. Its check suite becomes the newest github-actions suite on the
          # head SHA, so the ruleset's required `fast` check must come from
          # it — a green `fast` from only the dispatched run still leaves the
          # merge blocked. Under an approval-gated Actions policy the run lands
          # as action_required; approve it up front (this job has actions:
          # write) so it can run alongside the dispatched gate below.
          pr_ci_run=""
          for _ in $(seq 1 6); do
            pr_ci_run=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${branch}&event=pull_request&per_page=10" \
              --jq '.workflow_runs[0].id // empty' || true)
            [ -n "$pr_ci_run" ] && break
            sleep 5
          done
          if [ -n "$pr_ci_run" ] && \
             [ "$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_ci_run}" --jq '.conclusion // ""' || true)" = "action_required" ]; then
            retry gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_ci_run}/approve" || true
          fi
          if ! dispatch_workflow ci.yml "$branch" -f "base_sha=$base_sha"; then
            echo "lock PR checks failed; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The pull_request workflow-lint trigger ignores digest-lock PRs,
          # so without a dispatched run the required zizmor check never
          # reports on the head SHA and the armed auto-merge stays blocked.
          if ! dispatch_workflow workflow-lint.yml "$branch"; then
            echo "lock PR zizmor check failed; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Wait for the pull_request run once it is real (jobs started —
          # directly, or after the approval above); cancelling one flips the
          # required check to cancelled and the merge stays blocked. A stillborn
          # run never starts jobs; it sits in startup until the branch-deleting
          # merge kills it with a spurious "workflow file issue" failure, so it
          # is still cancelled here.
          if [ -n "$pr_ci_run" ]; then
            pr_ci_real=false
            for _ in $(seq 1 18); do
              pr_ci_conclusion=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_ci_run}" \
                --jq '.conclusion // ""' || true)
              if [ "$pr_ci_conclusion" = "action_required" ]; then
                retry gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_ci_run}/approve" || true
              elif [ -n "$pr_ci_conclusion" ]; then
                break
              fi
              pr_ci_jobs=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${pr_ci_run}/jobs?per_page=1" \
                --jq '.total_count // 0' || echo 0)
              [ "$pr_ci_jobs" -gt 0 ] && pr_ci_real=true && break
              sleep 10
            done
            if [ "$pr_ci_real" = true ]; then
              gh run watch --repo "$GITHUB_REPOSITORY" "$pr_ci_run" --interval 30 || true
            else
              # Cancelling an already-completed run errors; retrying that
              # error burns ~2.5min. Check status first and keep the retry
              # only for runs that are genuinely still in progress.
              pr_ci_status=$(retry gh run view --repo "$GITHUB_REPOSITORY" "$pr_ci_run" \
                --json status --jq '.status // empty' || true)
              if [ "$pr_ci_status" != "completed" ]; then
                retry gh run cancel --repo "$GITHUB_REPOSITORY" "$pr_ci_run" || true
              fi
            fi
          fi
          # --auto arms auto-merge so required checks that are still
          # registering do not fail the merge call; when every required
          # check is already green it merges at once.
          if ! retry gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch "$pr_url"; then
            echo "lock PR merge was blocked; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The merge may only be armed: wait for it to land before the
          # observational post-merge dispatches. A still-pending PR after the
          # wait merges on its own once checks pass, so that is not a failure.
          merged=false
          for _ in $(seq 1 36); do
            merged_at=$(retry gh api "repos/$GITHUB_REPOSITORY/pulls/${pr_url##*/}" --jq '.merged_at // empty' || true)
            [ -n "$merged_at" ] && { merged=true; break; }
            sleep 10
          done
          if [ "$merged" != true ]; then
            # Auto-merge can stay armed indefinitely even with every required
            # check green when the arm races the last check completion and no
            # further check event triggers a re-evaluation. A direct merge is
            # still gated by the branch ruleset, so it can only land when the
            # required checks actually pass; on failure the armed auto-merge
            # is left in place for GitHub to resolve later.
            if retry gh pr merge --repo "$GITHUB_REPOSITORY" --squash --delete-branch "$pr_url"; then
              merged=true
            else
              echo "auto-merge is armed on $pr_url and a direct merge attempt was blocked; the lock PR was left open for manual review" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # The post-merge checks are fire-and-forget: this job dispatches
          # them on main, records their run URLs, and finishes. Completion
          # is delegated to main-ci-failure-issue, which watches every
          # completed main run and files the tracking issue on failures.
          dispatch_and_forget ci.yml main -f "base_sha=$base_sha" || true
          main_run_url="${DISPATCH_RUN_URL:-no run observed}"
          echo "post-merge main CI dispatched: ${main_run_url}" >> "$GITHUB_STEP_SUMMARY"
          dispatch_and_forget locked-image-check.yml main || true
          lock_run_url="${DISPATCH_RUN_URL:-no run observed}"
          echo "post-merge locked image check dispatched: ${lock_run_url}" >> "$GITHUB_STEP_SUMMARY"
          dispatch_and_forget workflow-lint.yml main || true
          lint_run_url="${DISPATCH_RUN_URL:-no run observed}"
          echo "post-merge workflow lint dispatched: ${lint_run_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::post-merge verification for ${pr_url} is delegated to main-ci-failure-issue: ${main_run_url} ${lock_run_url} ${lint_run_url}"
