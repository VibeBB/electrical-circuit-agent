[project]
name = "circuit-agent"
version = "0.1.0"
description = "OpenHands plugin foundation for conversational KiCad design"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pdfplumber==0.11.10",
    "pillow==12.3.0",
    "cadquery-ocp-novtk==8.0.1.0.0",
    "mcp>=1.29,<2",
    "openhands-sdk==1.52.0",
    "openhands-tools==1.52.0",
]

[dependency-groups]
dev = [
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit"]

[tool.uv]
required-version = "==0.12.23"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = ["scripts/structural_coverage.py", "tests/test_structural_coverage.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/circuit/hooks/scripts",
    "plugins/circuit/scripts",
]
exclude = ["**/__pycache__", ".venv"]

[tool.coverage.run]
branch = true
source = ["src/circuit"]

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
c0 = 83
c1 = 72
decision = 69
c2 = 64
mcdc = 37
boundary = 36

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = [".", "tests"]
markers = ["docker: tests requiring the circuit-tools Docker image"]
