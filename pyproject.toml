[project]
name = "circuit-agent"
version = "0.1.0"
description = "OpenHands plugin foundation for conversational KiCad design"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pdfplumber==0.11.10",
    "pillow==13.0.0",
    "cadquery-ocp-novtk==8.0.1.0.0",
    "mcp>=1.29,<2",
    "openhands-sdk==1.59.0",
    "openhands-tools==1.59.0",
]

[dependency-groups]
dev = [
    "packaging>=26",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit"]

[tool.uv]
required-version = "==0.13.6"
# litellm>=1.104 pins filelock<4.0, which keeps the image-publish Trivy gate
# on CVE-2026-112940. filelock's locking API is unchanged in 4.x, so the
# override is safe; drop it once litellm relaxes the cap.
override-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
  "plugins/circuit/hooks/scripts/_records.py",
  "plugins/circuit/hooks/scripts/require_records.py",
  "plugins/circuit/hooks/scripts/blind_guard.py",
  "src/circuit/_vrp.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# VRP v2 files are byte-identical to the wire-agent canonical copies.
"plugins/circuit/hooks/scripts/_records.py" = ["ALL"]
"plugins/circuit/hooks/scripts/require_records.py" = ["ALL"]
"plugins/circuit/hooks/scripts/blind_guard.py" = ["ALL"]
"src/circuit/_vrp.py" = ["ALL"]
# Ported from wire-agent tests/test_records.py; fixtures keep wire's line widths.
"tests/test_records.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "src",
    "scripts",
    "tests",
    "plugins/circuit/hooks/scripts",
    "plugins/circuit/scripts",
]
exclude = ["**/__pycache__", ".venv"]

[tool.coverage.run]
branch = true
source = ["src/circuit"]

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
c0 = 83
c1 = 72
decision = 69
c2 = 64
mcdc = 37
boundary = 37


[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["src/circuit/libverify.py"]
tests = ["tests/test_gate_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto --dist loadgroup"
pythonpath = [".", "tests"]
markers = ["docker: tests requiring the circuit-tools Docker image"]
